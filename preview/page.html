<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page — preview</title>
<link rel="stylesheet" href="assets/acss-sim.css">
<style>
:where([data-etch-element="section"]) {
  inline-size: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
}

:where([data-etch-element="container"]) {
  inline-size: 100%;
  display: flex;
  flex-direction: column;
  max-inline-size: var(--content-width, 1366px);
  align-self: center; margin-inline: auto;
}

:where(:root) {
  /* ===== MAIN TEMPLATE COLOURS — change colours here only =====
     Header, footer and every main-* section use these variables.
     By default they follow ACSS: changing Primary / Secondary in ACSS changes the templates too. */
  --main-primary: var(--primary, #1e3a5f);    /* brand: header, footer, FAQ, headings, links, tags */
  --main-accent: var(--secondary, #e8a33d);   /* highlight: underlines, hover, eyebrow line, active */
  --main-light: var(--white, #fff);           /* light backgrounds: sections, cards, article box */
  --main-text: var(--text-dark, #1a1a1a);     /* text on light backgrounds */
  --main-on-primary: var(--white, #fff);      /* text and icons on the primary colour */

  /* derived from the five colours above — no need to edit */
  --main-light-alt: color-mix(in srgb, var(--main-primary) 6%, var(--main-light));
  --main-text-muted: color-mix(in srgb, var(--main-text) 72%, transparent);
  --main-on-primary-muted: color-mix(in srgb, var(--main-on-primary) 78%, transparent);
  --main-line: color-mix(in srgb, var(--main-primary) 18%, transparent);
  --main-line-on-primary: color-mix(in srgb, var(--main-on-primary) 18%, transparent);
  --main-accent-soft: color-mix(in srgb, var(--main-accent) 20%, var(--main-light));
  --main-shadow: color-mix(in srgb, var(--main-text) 12%, transparent);
}

:root:has(.main-header) {
  /* Colours come from the main colours (:where(:root)) — change them there.
     Declared on :root because the mobile drawer is moved to <body> when it opens. */
  --main-header-logo-height: 40px;

  @media (width <= 768px) {
    --main-header-logo-height: 32px;
  }
}

.main-header {
  pointer-events: none;
  z-index: 50;
  padding: 0;

  > * {
    pointer-events: auto;
  }

  /* position (data attributes on this element) */
  &[data-overlay-header='true'],
  &[data-sticky-header='true'] {
    inset-block-start: var(--wp-admin--admin-bar--height, 0px);
  }

  &[data-overlay-header='true'] {
    position: absolute;
  }

  &[data-sticky-header='true'] {
    position: sticky;
  }

  &[data-sticky-header='true'][data-overlay-header='true'] {
    position: fixed;
  }

  &[data-overlay-header='true'][data-overlay-header-offset='true'] + main > :first-child > :first-child {
    margin-block-start: var(--header-height);
  }

  &[data-hide-on-scroll='true'] .main-header__bar {
    transition: transform 0.4s cubic-bezier(0.55, 0, 0.1, 1);
  }

  &.hide .main-header__bar {
    transform: translateY(-100%);
  }

  /* ACSS gives every <button> outside a <nav> button typography — keep menu buttons like links */
  button.main-header__link {
    font-weight: inherit;
    font-family: inherit;
    line-height: inherit;
    letter-spacing: inherit;
    text-transform: none;
  }

  .skip-link {
    position: absolute;
    top: -1500px;
    left: 32px;
    z-index: 999;
    background: var(--main-light);
    color: var(--main-text);

    &:focus-visible {
      top: 32px;
    }
  }
}

.main-header__bar {
  inline-size: 100%;
  padding: var(--space-xs) var(--gutter);
  background-color: var(--main-primary);
  color: var(--main-on-primary);
  border-block-end: 1px solid var(--main-line-on-primary);
}

.main-header__container {
  flex-direction: row;
  justify-content: space-between;
  align-items: center;
  gap: var(--space-m);

  /* desktop nav (Oh My Etch root) fills the middle so the links sit centred.
     Styled from here: Etch drops class-prop ids on paste for the Nav's styling group. */
  > [data-ome-nav-menu-root] {
    flex: 1 1 auto;

    @media (width <= 1199px) {
      display: none;
    }
  }

  @media (width >= 1200px) {
    > [data-ome-mobile-nav-root] {
      display: none;
    }
  }
}

.main-header__logo {
  display: flex;
  flex-shrink: 0;
}

.main-header__logo-img {
  block-size: var(--main-header-logo-height);
  inline-size: auto;
  max-inline-size: 100%;
  object-fit: contain;
}

.main-header__nav-list {
  justify-content: center;
  align-items: center;
  gap: var(--space-xs);
}

.main-header__link {
  position: relative;
  display: inline-flex;
  align-items: center;
  gap: 0.25em;
  padding: var(--btn-padding-block, 0.75em) var(--btn-padding-inline, 1em);
  background: none;
  border: 0;
  font: inherit;
  font-size: var(--text-s);
  line-height: 1;
  white-space: nowrap;
  color: var(--main-on-primary);
  text-decoration: none;
  cursor: pointer;

  /* animated underline */
  &::after {
    content: '';
    position: absolute;
    inset-inline: var(--btn-padding-inline, 1em);
    inset-block-end: 0.35em;
    block-size: 2px;
    background-color: var(--main-accent);
    transform: scaleX(0);
    transform-origin: left;
    transition: transform 0.25s ease;
  }

  &:hover::after,
  &[aria-current='page']::after,
  &[aria-expanded='true']::after {
    transform: scaleX(1);
  }

  [data-ome-nav-menu-trigger-chevron] {
    transition: rotate 0.2s ease;
  }

  &[aria-expanded='true'] [data-ome-nav-menu-trigger-chevron] {
    rotate: 180deg;
  }
}

.main-header__dropdown {
  display: flex;
  flex-direction: column;
  min-inline-size: 220px;
  padding-block: var(--space-xs);
  background-color: var(--main-primary);
  border-block-start: 3px solid var(--main-accent);
  box-shadow: 0 16px 36px var(--main-shadow);
  transition: opacity 0.15s ease, translate 0.15s ease;

  &[data-ome-state='closed'] {
    opacity: 0;
    translate: 0 8px;
  }
}

.main-header__dropdown-link {
  display: block;
  padding: 0.6em 1.25em;
  font-size: var(--text-s);
  line-height: 1.3;
  white-space: nowrap;
  color: var(--main-on-primary);
  text-decoration: none;
  transition: background-color 0.15s ease;

  &:not(:last-child) {
    box-shadow: inset 0 -1px 0 var(--main-line-on-primary);
  }

  &:hover,
  &:focus-visible {
    background-color: var(--main-accent);
  }

  &:focus-visible {
    outline: 2px solid var(--main-on-primary);
    outline-offset: -2px;
  }
}

.main-header__actions {
  display: flex;
  align-items: center;
  gap: var(--space-xs);
  flex-shrink: 0;

  /* tablet: keep the buttons next to the hamburger */
  @media (width <= 1199px) {
    margin-inline-start: auto;
  }

  @media (width <= 768px) {
    display: none;
  }
}

.main-header__burger {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-inline-size: 44px;
  min-block-size: 44px;
  padding: 0;
  background: none;
  border: 0;
  color: var(--main-on-primary);
  cursor: pointer;

  svg {
    inline-size: 28px;
    block-size: 28px;
  }
}

.main-header__drawer {
  --ome-drawer-overlay-color: color-mix(in srgb, var(--main-text) 60%, transparent);
  --ome-drawer-animation-duration: 250ms;
  inline-size: min(360px, 85vw);
  padding-block-start: var(--wp-admin--admin-bar--height, 0px);
  background-color: var(--main-primary);
  color: var(--main-on-primary);
  border-block-start: 3px solid var(--main-accent);

  /* ACSS gives every <button> outside a <nav> button typography — keep menu buttons like links */
  .main-header__mobile-link,
  .main-header__drawer-button {
    font-weight: inherit;
    font-family: inherit;
    line-height: inherit;
    letter-spacing: inherit;
    text-transform: none;
  }
}

.main-header__drawer-content {
  --_min-width: 100%;
  --_min-height: 100dvh;
  --_background: var(--main-primary);
  --_color: var(--main-on-primary);
  --_panel-background: var(--main-primary);
}

.main-header__drawer-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--space-xs);
  padding: var(--space-xs) var(--gutter);
  border-block-end: 1px solid var(--main-line-on-primary);
}

.main-header__drawer-button {
  display: inline-flex;
  align-items: center;
  gap: 0.375em;
  min-inline-size: 44px;
  min-block-size: 44px;
  margin-inline-start: auto;
  padding: 0;
  background: none;
  border: 0;
  font: inherit;
  color: inherit;
  cursor: pointer;

  &[data-ome-mobile-nav-back] {
    margin-inline-start: 0;
  }
}

a.main-header__phone {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: var(--space-xs);
  white-space: nowrap;

  svg {
    inline-size: 1em;
    block-size: 1em;
    flex: 0 0 auto;
  }
}

.main-header__mobile-list {
  display: grid;
  padding-inline: var(--gutter);
}

.main-header__mobile-item {
  display: flex;
  align-items: stretch;
  border-block-end: 1px solid var(--main-line-on-primary);
}

.main-header__mobile-link {
  display: flex;
  align-items: center;
  justify-content: space-between;
  inline-size: 100%;
  min-block-size: 48px;
  padding-block: var(--space-xs);
  padding-inline: 0;
  background: none;
  border: 0;
  font: inherit;
  text-align: start;
  color: var(--main-on-primary);
  text-decoration: none;
  cursor: pointer;

  &:hover,
  &:focus-visible {
    color: var(--main-accent);
  }
}

.main-header__next-icon {
  display: inline-flex;
  inline-size: 1em;
  block-size: 1em;
  flex-shrink: 0;
}

.main-header__mobile-slot {
  display: flex;
  flex-direction: column;
  gap: var(--space-xs);
  padding: var(--space-m) var(--gutter);
}

iewport] > [data-ome-nav-menu-content][data-ome-motion="to-start"] { animation: ome-nav-menu-exit-to-start 150ms ease; } &[data-ome-use-animated-menu="true"] > [data-ome-nav-menu-viewport][data-ome-full-width="true"] > [data-ome-nav-menu-content][data-ome-motion="to-start"] { animation: none; } &[data-ome-use-animated-menu="true"] > [data-ome-nav-menu-viewport][data-ome-full-width="true"] > [data-ome-nav-menu-content][data-ome-motion="to-start"] > [data-ome-nav-menu-motion-layer] { animation: ome-nav-menu-exit-to-start 150ms ease; } &[data-ome-use-animated-menu="true"] > [data-ome-nav-menu-viewport] > [data-ome-nav-menu-content][data-ome-motion="to-end"] { animation: ome-nav-menu-exit-to-end 150ms ease; } &[data-ome-use-animated-menu="true"] > [data-ome-nav-menu-viewport][data-ome-full-width="true"] > [data-ome-nav-menu-content][data-ome-motion="to-end"] { animation: none; } &[data-ome-use-animated-menu="true"] > [data-ome-nav-menu-viewport][data-ome-full-width="true"] > [data-ome-nav-menu-content][data-ome-motion="to-end"] > [data-ome-nav-menu-motion-layer] { animation: ome-nav-menu-exit-to-end 150ms ease; } &[data-ome-use-animated-menu="true"] > [data-ome-nav-menu-viewport]:not([data-ome-full-width="true"]) > [data-ome-nav-menu-content][data-ome-motion] { animation: none; } &[data-ome-use-animated-menu="true"] > [data-ome-nav-menu-viewport]:not([data-ome-full-width="true"]) > [data-ome-nav-menu-content] { transition: none; } & [data-ome-nav-menu-trigger-chevron] { transition: transform var(--transition-duration, 250ms) ease; } & [data-ome-nav-menu-trigger][data-ome-state="open"] [data-ome-nav-menu-trigger-chevron] { transform: rotate(180deg); }

}

  justify-content: flex-start; align-items: stretch; gap: 0

.ome-nav-menu-default__item {
  min-inline-size: 0
}

.ome-nav-menu__trigger {

[data-ome-inline-docs-callout] {

}

[data-ome-inline-docs-callout][data-ome-inline-docs-tone="warning"] {
  background: var(--warning-ultra-light, #fff7ed); border-color: var(--warning-light, #fdba74); color: var(--warning-dark, #9a3412)

  display: contents
}

:where([data-ome-drawer-close]) {
  &[data-ome-disabled="true"] { pointer-events: none; }
}

:where([data-ome-drawer-root]) {
  display: block; &[hidden] { display: none; }
}

}

.site-header {
  /* Colours come from the main colours (:where(:root)) — change them there */
  --header-bg: var(--main-primary);
  --header-text: var(--main-on-primary);
  --header-accent: var(--main-accent);
  --header-border: var(--main-line-on-primary);
  --header-panel-bg: var(--main-primary);
  --header-logo-height: 40px;
  --ease-swift: cubic-bezier(0.55, 0, 0.1, 1);

  pointer-events: none;
  z-index: 50;
  padding: 0;

  > * {
    pointer-events: auto;
  }

  @media (width <= 768px) {
    --header-logo-height: 32px;
  }

  /* ===== POSITION (data attributes on this element) ===== */
  &[data-overlay-header='true'],
  &[data-sticky-header='true'] {
    inset-block-start: var(--wp-admin--admin-bar--height, 0px);
  }

  &[data-overlay-header='true'] {
    position: absolute;
  }

  &[data-sticky-header='true'] {
    position: sticky;
  }

  &[data-sticky-header='true'][data-overlay-header='true'] {
    position: fixed;
  }

  &[data-overlay-header='true'][data-overlay-header-offset='true'] + main > :first-child > :first-child {
    margin-block-start: var(--header-height);
  }

  &[data-hide-on-scroll='true'] .site-header__bar {
    transition: transform 0.4s var(--ease-swift);
  }

  &.hide .site-header__bar {
    transform: translateY(-100%);
  }

  /* ===== HAMBURGER: only while the menu is in mobile mode ===== */
  #mobile-menu-toggle {
    display: none;
  }

  &:has(.menu-wrapper.mobile) :is(#mobile-menu-toggle, .toggle) {
    display: flex;
  }

  /* tablet: keep the buttons next to the hamburger */
  &:has(.menu-wrapper.mobile) .site-header__actions {
    margin-inline-start: auto;
  }

  .toggle {
    --toggle-icon-color: var(--header-text);
    color: var(--header-text);
  }

  /* ===== SKIP LINK (added by script) ===== */
  .skip-link {
    position: absolute;
    top: -1500px;
    left: 32px;
    z-index: 999;
    overflow: hidden;
    background: var(--main-light);
    color: var(--main-text);

    &:focus-visible {
      top: 32px;
    }
  }

  /* ===== MENU VARIABLES ===== */
  --link-color: var(--header-text);
  --link-color-hover: var(--header-text);
  --link-color-active: var(--header-accent);
  --link-bg-color: transparent;
  --link-bg-color-hover: transparent;
  --link-bg-color-active: transparent;
  --link-font-weight: var(--btn-font-weight);
  --link-transition: all 0.2s ease-out;
  --link-padding-inline: var(--btn-padding-inline, 1em);
  --link-padding-block: var(--btn-padding-block, 0.75em);
  --link-border-radius: var(--btn-border-radius);

  --dropdown-padding: calc(calc(5 * 1rem / var(--etch-root-px, 10)) + 3px) 0 calc(5 * 1rem / var(--etch-root-px, 10));
  --dropdown-border-radius: 0;
  --dropdown-border-width: 0px;
  --dropdown-border-color: transparent;
  --dropdown-bg: linear-gradient(var(--header-accent), var(--header-accent)) top / 100% 3px no-repeat, var(--header-panel-bg);
  --dropdown-box-shadow: 0 16px 36px var(--main-shadow);
  --dropdown-closed-top: 30px;
  --dropdown-open-top: 22px;

  --mobile-menu-padding-inline: var(--gutter);
  --mobile-menu-padding-block: var(--space-m);
  --mobile-menu-bg-color: var(--header-panel-bg);
  --mobile-menu-width: 768px;
  --mobile-dropdown-stacked-timing: cubic-bezier(0.86, 0.01, 0.09, 1.01);

  /* ===== DROPDOWN ANIMATION ===== */
  .menu-dropdown .menu-dropdown__content-wrapper {
    filter: blur(4px);
  }

  .menu-dropdown.is-open > .menu-dropdown__content-wrapper {
    filter: blur(0);
  }

  .menu-wrapper.desktop .menu-dropdown .menu-dropdown__content-wrapper,
  .menu-wrapper.desktop .morph-container {
    scale: 0.95;
  }

  .menu-wrapper.desktop .menu-dropdown.is-open > .menu-dropdown__content-wrapper,
  .menu-wrapper.desktop .morph-container.is-active {
    scale: 1;
  }

  .menu-dropdown-back-button {
    font-weight: var(--link-font-weight);
    padding-block: 1em;
    padding-inline: var(--mobile-menu-padding-inline);
    color: var(--link-color);
    background-color: var(--mobile-menu-bg-color);
    border-block-end: 1px solid var(--header-border);
  }

  /* show desktop menu before the menu script initialises */
  .menu-wrapper.desktop:not([data-menu-initialized]) {
    @media (width >= 1200px) {
      opacity: 1;
    }
  }

  /* ===== DESKTOP MENU (centred between logo and buttons) ===== */
  .menu-wrapper.desktop {
    flex: 1 1 auto;

    .site-header__nav-list {
      justify-content: center;
    }

    .site-header__nav-list > li {
      inline-size: fit-content;
      white-space: nowrap;
    }

    .site-header__nav-list > li > *:is(a, button) {
      position: relative;
      padding-inline: var(--link-padding-inline);
      padding-block: var(--link-padding-block);
      border-radius: var(--link-border-radius);
      font-size: var(--text-s);
      line-height: 100%;
      color: var(--link-color);
      text-decoration: none;
      transition: var(--link-transition);

      /* animated underline */
      &::after {
        content: '';
        position: absolute;
        left: var(--link-padding-inline, 1em);
        right: var(--link-padding-inline, 1em);
        bottom: 0.35em;
        height: 2px;
        background-color: var(--header-accent);
        transform: scaleX(0);
        transform-origin: left;
        transition: transform 0.25s ease;
      }

      &:hover::after,
      &[aria-expanded='true']::after {
        transform: scaleX(1);
      }

      &.active-link {
        color: var(--link-color-active);
      }
    }

    .menu-dropdown__content {
      min-inline-size: 220px;
      gap: 0;
    }

    .menu-dropdown__content > li:not(:last-child) > a {
      box-shadow: inset 0 -1px 0 var(--header-border);
    }

    .menu-dropdown__content > li > a {
      display: block;
      padding: 0.6em 1.25em;
      font-size: var(--text-s);
      font-weight: 400;
      line-height: 1.3;
      color: var(--header-text);
      text-decoration: none;
      white-space: nowrap;
      transition: background-color 0.15s ease;

      &:hover,
      &:focus-visible {
        background-color: var(--header-accent);
        color: var(--header-text);
      }

      &:focus-visible {
        outline: 2px solid var(--header-text);
        outline-offset: -2px;
      }

      &[href='#'] {
        cursor: default;
      }
    }
  }

  /* ===== MOBILE MENU ===== */
  .menu-wrapper.mobile {
    .menu-wrapper__inner {
      display: flex;
      flex-direction: column;
      border-block-start: 3px solid var(--header-accent);
      color: var(--header-text);
    }

    .site-header__nav {
      flex: 1;
      position: relative;
      padding-inline: var(--mobile-menu-padding-inline);
      overflow-y: auto;
      overflow-x: clip;
    }

    .site-header__nav-list {
      flex-direction: column;
      justify-content: flex-start;
      flex-grow: 1;
      block-size: 100%;

      > li {
        inline-size: 100%;
        max-inline-size: 100%;
        border-block-end: 1px solid var(--header-border);

        > a,
        .menu-dropdown,
        .menu-dropdown__trigger {
          inline-size: 100%;
        }
      }
    }

    .site-header__nav-list > li > *:is(a, button),
    .menu-dropdown__content > li > *:is(a, button) {
      padding-block: var(--btn-padding-block);
      padding-inline: 0;
      line-height: 100%;
      color: var(--header-text);
      text-decoration: none;
      background-color: transparent;
      transition: var(--link-transition);

      &:hover,
      &[aria-expanded='true'] {
        color: var(--header-accent);
      }
    }

    .menu-dropdown__trigger {
      inline-size: 100%;
      justify-content: space-between;
    }

    .menu-dropdown__content-wrapper {
      background-color: transparent;
    }

    .menu-dropdown__content a {
      opacity: 0.8;
    }

    :where(& .menu-dropdown__content-wrapper.stacked-mode .menu-dropdown__content) {
      padding-block: var(--mobile-menu-padding-block);
      padding-inline: var(--mobile-menu-padding-inline);
    }

    :where(& .menu-dropdown.accordion-mode .menu-dropdown__content) {
      padding-inline: var(--space-xs);
    }

    :where(& .menu-dropdown.accordion-mode[data-mega-menu='true'] .menu-dropdown__content) {
      padding-block: var(--space-xs);
    }
  }
}

.site-header__bar {
  inline-size: 100%;
  padding: var(--space-xs) var(--gutter);
  background-color: var(--header-bg);
  border-block-end: 1px solid var(--header-border);

.menu-wrapper:where(.site-header *) {
  gap: 0;
  inline-size: fit-content;

  /* - on mobile off canvas mode */
  &.mobile.off-canvas-mode {
    position: fixed;
    inset: 0;
    visibility: hidden;
    inline-size: 100%;
    pointer-events: none;
    z-index: 999;
    opacity: 1;
    transition: visibility var(--mobile-menu-transition-duration, 0.2s) ease-out;
  }

  /* - on mobile reveal mode */
  &.mobile.reveal-mode {
    inline-size: 100%;
    position: absolute;
    inset-block-start: 100%;
    inset-inline: 0;
    overflow: hidden;
    visibility: hidden;
    clip-path: polygon(0 0, 100% 0, 100% 0, 0 0);
    background-color: var(--mobile-menu-bg-color);
    transition: clip-path, visibility, transform, opacity;
    transition-duration: var(--mobile-menu-transition-duration, 0.2s);
    transition-timing-function: cubic-bezier(0.42, 0, 0.58, 1);

    .menu-wrapper__inner {
      overflow-y: auto;
      overflow-x: clip;
      transform: translateY(20px);
    }

    .site-header__nav {
      padding-block-end: var(--mobile-menu-padding-block);
    }
  }

  /* - on mobile AND on open */
  &.mobile.open {
    visibility: visible;
    opacity: 1;
  }

  /* - on mobile AND open AND reveal mode */
  &.mobile.reveal-mode.open {
    clip-path: polygon(0 0, 100% 0, 100% 100%, 0 100%);

    .menu-wrapper__inner {
      transform: translateY(0);
    }
  }

  /* HELPER CLASSES */

  /* - hide item on desktop */
  &.desktop :is(.hide-from-desktop-menu, [data-menu-hide='desktop']) {
    display: none;
  }

  /* - hide item on mobile */
  &.mobile :is(.hide-from-mobile-menu, [data-menu-hide='mobile']) {
    display: none;
  }

  /* hide menu until initialized */

  &:not([data-menu-initialized]) {
    opacity: 0;
  }

  /* MORPH MODE (desktop shared morphing container, JS-created) */
  .morph-container {
    position: absolute;
    inset-block-start: 100%;
    inset-inline-start: 0;
    z-index: 999;
    background: var(--dropdown-bg, white);
    box-shadow: var(--dropdown-box-shadow);
    border-radius: var(--dropdown-border-radius);
    border: var(--dropdown-border-width) solid var(--dropdown-border-color);
    visibility: hidden;
    opacity: 0;
    transform: translateY(var(--dropdown-closed-top, 40px));
    transition-property: opacity, transform, visibility, scale;
    transition-duration: var(--dropdown-transition-duration, 0.15s);
    transition-timing-function: var(--dropdown-transition-timing, cubic-bezier(0.4, 0, 0.2, 1));
    transition-delay: var(--dropdown-transition-delay, 0s);

    /* open / close */
    &.is-active {
      visibility: visible;
      opacity: 1;
      transform: translateY(var(--dropdown-open-top, 20px));
    }

    /* JS adds is-morphing while sliding between panels: the container box
       itself animates position and size, and clips the panel slide */
    &.is-morphing {
      overflow: clip;
      transition-property: opacity, transform, visibility, inset-inline-start, inline-size, block-size;
      transition-duration: var(--dropdown-transition-duration, 0.3s);
      transition-timing-function: var(--dropdown-transition-timing, cubic-bezier(0.4, 0, 0.2, 1));
    }

    /* panels: shown via is-active (the .is-open parent selector no longer
       applies once JS moves them into the shared container) */
    .menu-dropdown__content-wrapper.morph-panel {
      transition-property: opacity, visibility;

      &.is-active {
        visibility: visible;
        opacity: 1;
      }

      /* the shared container carries the dropdown chrome instead */
      > .menu-dropdown__content {
        background: transparent;
        box-shadow: none;
        border: none;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      transition: none;
    }
  }
}

.menu-wrapper__inner:where(.site-header *) {
  pointer-events: auto;
  min-block-size: 0px;
  transition-property: visibility, opacity, transform;
      transition-duration: var(--mobile-menu-transition-duration, 0.2s);
      transition-timing-function: cubic-bezier(0.42, 0, 0.58, 1);

  .menu-wrapper.off-canvas-mode.mobile & {
    position: absolute;

    opacity: 0;
    visibility: hidden;
    background: var(--mobile-menu-bg-color);

  .menu-wrapper.off-canvas-mode.mobile[data-mobile-off-canvas-direction='from left' i] & {
    transform: translateX(-100%);

    html[dir='RTL'] & {
      inset-inline-end: 0;
      inset-inline-start: unset;
    }
  }

  .menu-wrapper.off-canvas-mode.mobile[data-mobile-off-canvas-direction='from top' i] & {
    transform: translateY(-100%);

  }

  .menu-wrapper.off-canvas-mode.mobile[data-mobile-off-canvas-direction='from bottom' i] & {

  .menu-wrapper:not(.off-canvas-mode).mobile & {

.menu-wrapper-backdrop:where(.site-header *) {
  position: fixed;
  inset: 0;
  z-index: 998;
  background-color: var(--mobile-menu-backdrop-color);
  opacity: 0%;
  visibility: hidden;
  transition-property: opacity, visibility;
  transition-duration: var(--mobile-menu-transition-duration);
  transition-delay: calc(var(--mobile-menu-transition-duration) / 1.5);
  transition-timing-function: ease-out;
  pointer-events: none;

  .menu-wrapper.open & {
    visibility: visible;
    opacity: var(--mobile-menu-backdrop-opacity);
  }
}

.menu-link:where(.site-header *) {
  display: flex;
  align-items: center;
}

.menu-dropdown:where(.site-header *) {
  /* on open */
  &.is-open > .menu-dropdown__content-wrapper {
    visibility: visible;
    opacity: 1;
  }

  .menu-dropdown .menu-dropdown__trigger {
    inline-size: 100%;
    justify-content: space-between;
    text-align: start;
  }

  /* DROPDOWN MODE */
  &.dropdown-mode {
    position: relative;

    .menu-dropdown__content-wrapper {
      transform: translateY(var(--dropdown-closed-top, 40px));
      height: fit-content;
    }

    .menu-dropdown__content {
      padding: var(--dropdown-padding);
      block-size: fit-content;
      background: var(--dropdown-bg, white);
      box-shadow: var(--dropdown-box-shadow);
      border-radius: var(--dropdown-border-radius);
      border-width: var(--dropdown-border-width);
      border-color: var(--dropdown-border-color);
      border-style: solid;
    }

    /* - nested dropdowns */
    .menu-dropdown {
      /* -- Nested trigger styling */
      .menu-dropdown__trigger {
        inline-size: 100%;
        justify-content: space-between;
        text-align: start;

        /* --- Rotate arrow 90° for nested (pointing right) */
        .menu-dropdown__trigger-icon {
          transform: rotate(-90deg);

          html[dir='rtl'] & {
            transform: rotate(90deg);
          }
        }

        &.active .menu-dropdown__trigger-icon {
          transform: rotate(0deg); /* Back to pointing down when open */
        }
      }

      > .menu-dropdown__content-wrapper {
        position: absolute;
        inset-inline-start: calc(100% + var(--dropdown-padding));
      }
    }

    .menu-dropdown__content-wrapper {
      inset-block-end: 0;
    }

    /* - dropdown positioning */
    .menu-dropdown__content-wrapper.position-left {
      inset-inline-start: auto;
      inset-inline-end: 100%;
      margin-inline-start: 0;
      margin-inline-end: var(--dropdown-padding);

      &.position-bottom {
        transform-origin: top right;

        html[dir='rtl'] & {
          transform-origin: top left;
        }
      }

      &.position-top {
        transform-origin: bottom right;

        html[dir='rtl'] & {
          transform-origin: bottom left;
        }
      }
    }

    .menu-dropdown__content-wrapper.position-right {
      &.position-bottom {
        transform-origin: top left;

        html[dir='rtl'] & {
          transform-origin: top right;
        }
      }

      &.position-top {
        transform-origin: bottom left;

        html[dir='rtl'] & {
          transform-origin: bottom right;
        }
      }
    }

    .menu-dropdown__content-wrapper.position-top {
      inset-block-start: auto;
      inset-block-end: calc(100% + var(--dropdown-padding));
    }

    /* - transforming open */
    &.is-open > .menu-dropdown__content-wrapper {
      transform: translateY(var(--dropdown-open-top, 20px));
    }

    .menu-dropdown > .menu-dropdown__content-wrapper {
      transform: translateY(calc((var(--dropdown-padding) + var(--dropdown-border-width)) * -1));

      &.position-top {
        transform: translateY(calc(var(--dropdown-padding) + var(--dropdown-border-width)));
      }
    }
  }

  /* ACCORDION MODE */
  &.accordion-mode {
    inline-size: 100%;

    .menu-dropdown {
      flex-direction: column;
    }

    .menu-dropdown__content-wrapper {
      position: static;
    }
  }

  /* STACKED MODE */
  &.stacked-mode {
    .menu-dropdown__trigger-icon-wrapper {
      transform: rotate(-90deg);

      html[dir='rtl'] & {
        transform: rotate(90deg);
      }
    }
  }

  /* specifically not stacked mode flip trigger icon */
  &:not(.stacked-mode) .menu-dropdown__trigger.active .menu-dropdown__trigger-icon {
    transform: scaley(-1);
  }
}

.menu-dropdown__trigger:where(.site-header *) {
  display: flex;
  flex-direction: row;
  align-items: center;
  inline-size: fit-content;
  gap: var(--dropdown-trigger-gap, 0.5em);
}

.menu-dropdown__trigger-label:where(.site-header *) {
  white-space: nowrap;
}

.menu-dropdown__trigger-icon-wrapper:where(.site-header *) {
  inline-size: fit-content;
}

.menu-dropdown__trigger-icon:where(.site-header *) {
  block-size: var(--dropdown-trigger-icon-size, 1em);
  inline-size: var(--dropdown-trigger-icon-size, 1em);
  min-inline-size: var(--dropdown-trigger-icon-size, 1em);
  transition: transform var(--dropdown-transition-duration, 0.15s) ease-out;
  color: inherit;

  path {
    stroke: currentColor
  }
}

.menu-dropdown__content-wrapper:where(.site-header *) {
  position: absolute;
  inset-block-start: 100%;
  inset-inline-start: 0;
  min-inline-size: 200px;
  z-index: 999;
  transform-origin: top center;
  visibility: hidden;
  transition-property: var(--dropdown-transition-property, all);
  transition-duration: var(--dropdown-transition-duration, 0.15s);
  transition-delay: var(--dropdown-transition-delay, 0);
  transition-timing-function: var(--dropdown-transition-timing, cubic-bezier(0.4, 0, 0.2, 1));
  opacity: 0;

  &.stacked-mode {
    position: absolute;
    inset-block: 0;
    inset-inline: 0;
    background: var(--mobile-menu-bg-color);
    transform: translateX(100%);
    overflow-y: auto;
    overflow-x: clip;
    transform-origin: center center;
    transition-timing-function: var(--mobile-dropdown-stacked-timing, ease-out);
    transition-duration: var(--mobile-menu-transition-duration);

    .menu-dropdown-back-button {
      display: flex;
    }

    &.open {
      transform: translateX(0);
      scale: 1;
      visibility: visible;
      opacity: 1;
    }

    &.open:has(+ .menu-dropdown__content-wrapper.open) {
      transform: translateX(20px);
      scale: 0.98;

      /*RTL language flip direction */
      html[dir='RTL'] & {
        transform: translateX(-20px);
      }
    }

    .site-header__nav-list:has(~ &) {
      transform: translateX(0);
      scale: 1;
      transform-origin: center center;
      transition-property: transform, opacity, scale;
      opacity: 1;
      transition-duration: var(--mobile-menu-transition-duration);
      transition-delay: var(--dropdown-transition-delay, 0);
      transition-timing-function: var(--mobile-dropdown-stacked-timing, ease-out);
    }

    /* mobile dropdown stacked animations */
    .site-header__nav-list:has(~ &.open) {
      transform: translateX(20px);
      scale: 0.98;
      opacity: 0;

      /*RTL language flip direction */
      html[dir='rtl'] & {
        transform: translateX(-20px);
      }
    }
  }
}

.menu-dropdown-back-button:where(.site-header *) {
  align-items: center;
  gap: 0.5em;
  text-decoration: none;
  display: none;
  inline-size: 100%;
  z-index: 100;
  position: sticky;
  inset-block-start: -1px;

  svg {
    block-size: 1em;
    inline-size: 1em;
    order: -1;

    html[dir='rtl'] & {
      transform: rotate(180deg);
    }
  }
}

.menu-dropdown__content:where(.site-header *) {
  display: flex;
  flex-direction: column;
  --divider-gap: 0.5em;

  > li {
    display: flex;
    inline-size: 100%;
    max-inline-size: 100%;
  }

  > li > a,
  > li > button {
    inline-size: 100%;
  }
}

.toggle:where(.site-header *) {
  --ease-smooth: cubic-bezier(0.25, 0.8, 0.3, 1);
  display: flex;
  flex-direction: row;
  gap: var(--toggle-icon-gap, 0.25em);
  align-items: center;
  inline-size: fit-content;

  /*alternating labels */
  &.active .label-off {
    transform: translateY(-100%);
    opacity: 0;
  }

  &.active .label-on {
    transform: translateY(-100%);
    opacity: 1;
  }
}

.toggle__icon:where(.site-header *) {
  color: var(--toggle-icon-color, black);
  inline-size: var(--toggle-icon-size, 1.25em);
  block-size: var(--toggle-icon-size, 1.25em);

  path {
    stroke: currentColor;
    fill: currentColor;
  }
}

.toggle-animated-hamburger-1:where(.site-header *) {
  --transition-duration-rotate: var(--toggle-transition-duration, 0.2s);
  --transition-duration-collapse: calc(var(--transition-duration-rotate) / 1.5);
  inline-size: var(--toggle-icon-size, 1.25em);
  block-size: var(--toggle-icon-size, 1.25em);
  color: inherit;

  [class*='hamburger-line'] {
    stroke: var(--toggle-icon-color, currentColor);
    stroke-width: var(--toggle-icon-line-width, 8px);
    stroke-linecap: round;
    transition:
      /* rotation starts slightly after collapse begins */
      rotate var(--transition-duration-rotate) var(--ease-smooth),
      /* collapse moves start immediately */ transform var(--transition-duration-collapse) var(--ease-smooth) var(--transition-duration-rotate);
    transform-origin: center;
    transform: translateX(0) translateY(0);
    rotate: 0deg;
  }

  .toggle.active & .hamburger-line--top {
    transform: translateY(20px) translateX(0px);
    rotate: 45deg;
    transition:
      transform var(--transition-duration-collapse) var(--ease-smooth),
      rotate var(--transition-duration-rotate) var(--ease-smooth) var(--transition-duration-collapse);
  }

  .toggle.active & .hamburger-line--bottom {
    transform: translateY(-20px) translateX(0px);
    rotate: -45deg;
    transition:
      transform var(--transition-duration-collapse) var(--ease-smooth),
      rotate var(--transition-duration-rotate) var(--ease-smooth) var(--transition-duration-collapse);
  }
}

.toggle-animated-hamburger-2:where(.site-header *) {
  inline-size: var(--toggle-icon-size, 1.25em);
  block-size: var(--toggle-icon-size, 1.25em);
  color: inherit;

  [class*='hamburger-line'] {
    stroke: var(--toggle-icon-color, currentColor);
    stroke-width: var(--toggle-icon-line-width, 8px);
    stroke-linecap: round;
    transition:
      transform var(--toggle-transition-duration, 0.2s) var(--ease-smooth),
      opacity calc(var(--toggle-transition-duration, 0.2s) * 0.75) var(--ease-smooth);
    transform-origin: center;
    transform: translateX(0) translateY(0) rotate(0);
  }

  .toggle.active & .hamburger-line--top {
    transform: translateY(16px) translateX(-16px) rotate(45deg);
  }
  .toggle.active & .hamburger-line--middle {
    opacity: 0;
    transform: scaleX(0);
  }
  .toggle.active & .hamburger-line--bottom {
    transform: translateY(-16px) translateX(-16px) rotate(-45deg);
  }
}

.toggle-animated-hamburger-3:where(.site-header *) {
  inline-size: var(--toggle-icon-size, 1.25em);
  block-size: var(--toggle-icon-size, 1.25em);
  color: inherit;

  [class*='hamburger-line'] {
    stroke: var(--toggle-icon-color, currentColor);
    stroke-width: var(--toggle-icon-line-width, 8px);
    stroke-linecap: round;
    transition:
      transform var(--toggle-transition-duration, 0.2s) var(--ease-smooth),
      opacity calc(var(--toggle-transition-duration, 0.2s) * 0.75) ease,
      stroke-dasharray var(--toggle-transition-duration, 0.2s) var(--ease-smooth),
      stroke-dashoffset var(--toggle-transition-duration, 0.2s) var(--ease-smooth);
    transform-origin: center;
    transform: translateX(0) translateY(0) rotate(0);
  }

  .hamburger-line--middle {
    stroke-dasharray: 45 15;
    stroke-dashoffset: 45;
  }

  .hamburger-line--bottom {
    stroke-dasharray: 30 30;
    stroke-dashoffset: 30;
  }

  .toggle.active & .hamburger-line--top {
    transform: translateY(16px) translateX(-16px) rotate(45deg);
  }
  .toggle.active & .hamburger-line--middle {
    transform: scaleX(0);
    stroke-dasharray: 0 61;
    stroke-dashoffset: 1;
  }
  .toggle.active & .hamburger-line--bottom {
    transform: translateY(-16px) translateX(-16px) rotate(-45deg);
    stroke-dasharray: 60 0;
    stroke-dashoffset: 60;
  }
}

.toggle__label:where(.site-header *) {
  position: relative;
  display: inline-block;
  overflow: hidden;
  transition: inline-size var(--toggle-transition-duration, 0.2s) var(--ease-smooth);
  inline-size: fit-content;

  .toggle__label-text {
    display: block;
    white-space: nowrap;
    inline-size: fit-content;
  }

  /* For alternate mode: stack vertically */
  .label-off,
  .label-on {
    transition:
      transform 0.2s var(--ease-smooth),
      opacity 0.2s var(--ease-smooth);
    line-height: 1.2;
  }

  .label-off {
    transform: translateY(0%);
    opacity: 1;
  }

  .label-on {
    transform: translateY(100%);
    opacity: 0;
    position: absolute;
  }
}

<script type="module">
// Select the header element
const header = document.querySelector('.main-header');

// Early exit if header doesn't exist on this page
if (!header) {
  if (window.console) console.warn('Header element (.main-header) not found.');
} else {
  // 1. CONFIGURATION
  // Read once and cache to avoid repeated DOM access
  const ds = header.dataset;
  const config = {
    sticky: ds.stickyHeader === 'true',
    hide: ds.hideOnScroll === 'true',
    up: ds.showOnScrollUp === 'true',
    at: parseInt(ds.hideAt, 10) || 0,
    skipLink: ds.skipLink === 'true'
  };

  // 2. SKIP LINK
  // Add accessible skip link for keyboard navigation
  if (config.skipLink && !header.querySelector('.skip-link')) {
    const skipLink = document.createElement('a');
    skipLink.href = '#main';
    skipLink.className = 'skip-link';
    skipLink.textContent = 'Skip to main content';
    header.insertBefore(skipLink, header.firstChild);

    // Set id on main element
    const main = document.querySelector('main');
    if (main) {
      main.id = 'main';
    }
  }

  // 3. HEADER HEIGHT
  // Using ResizeObserver handles initial load, window resize, and content changes
  // It's more performant and robust than manual event listeners + debounce
  const updateHeight = () => document.documentElement.style.setProperty('--header-height', `${header.offsetHeight}px`);
  
  if (window.ResizeObserver) {
    new ResizeObserver(updateHeight).observe(header);
  } else {
    window.addEventListener('resize', updateHeight);
    window.addEventListener('load', updateHeight);
    updateHeight();
  }

  // 4. SCROLL LOGIC (Merged into single rAF loop)
  // Consolidating all scroll updates into one requestAnimationFrame callback
  // minimizes layout thrashing and synchronizes DOM updates with screen refreshes.
  if (config.sticky) {
    let lastY = window.scrollY;
    let ticking = false;
    let isHidden = false;
    const tolerance = 5; // Ignore tiny scroll movements

    const updateHeader = (forceVisible = false) => {
      const currentY = Math.max(0, window.scrollY); // Normalize for mobile bounce
      
      // Toggle 'scrolling' class based on any scroll from top
      header.classList.toggle('scrolling', currentY > 0);

      // Hide-on-scroll logic
      if (config.hide && config.at > 0) {
        const isMenuOpen = document.body.classList.contains('menu-open');
        const pastThreshold = currentY >= config.at;

        if (isMenuOpen || forceVisible) {
          isHidden = false;
        } else if (config.up) {
          // Mode: responsive to scroll direction past threshold
          if (!pastThreshold) {
            isHidden = false;
          } else {
            const diff = currentY - lastY;
            if (diff > tolerance) {
              isHidden = true; // Hiding because user is scrolling DOWN
            } else if (diff < -tolerance) {
              isHidden = false; // Showing because user is scrolling UP
            }
          }
        } else {
          // Mode: static threshold
          // If initial load, we don't hide immediately even if past threshold
          isHidden = pastThreshold;
        }

        header.classList.toggle('hide', isHidden);

        // Close all open dropdowns when header hides
        if (isHidden && window.Dropdowns) {
          window.Dropdowns.getAll()
            .filter(d => d.isOpen)
            .forEach(d => d.close({ cascade: true }));
        }
      }
      
      lastY = currentY;
      ticking = false;
    };

    const onScroll = () => {
      if (!ticking) {
        ticking = true;
        requestAnimationFrame(() => updateHeader(false));
      }
    };

    window.addEventListener('scroll', onScroll, { passive: true });
    
    // Initial state check - force visible on load regardless of position
    updateHeader(true);
  }
}

</script>

<script type="module">
// ============================================
// menuWrapper COMPONENT - SINGLE BREAKPOINT CONTROLLER
// ============================================

const menuWrapper = document.querySelector('[data-menu-element="menu-wrapper"]');

if (!menuWrapper) {
  if (window.console) console.warn("⚠️ No menu wrapper element found.");
} else {
  // 1. CONFIGURATION & STATE
  const ds = menuWrapper.dataset;
  const mobileMenuMode = ds.mobileMenuMode || "Off Canvas";
  const breakpoint = ds.mobileBreakpoint || "768px";
  const mediaQuery = window.matchMedia(`(max-width: ${breakpoint})`);
  
  // Store original location for desktop restoration
  const originalParent = menuWrapper.parentElement;
  const originalNextSibling = menuWrapper.nextSibling;
  const headerInner = document.querySelector('[data-menu-element="header-inner"]');
  if (!headerInner && window.console) {
    console.warn('⚠️ [Menu Wrapper] No header inner element found targeting [data-menu-element="header-inner"]. Mobile positioning may fail.');
  }

  // 2. TOGGLE LOGIC
  // Sync body class with menu state
  menuWrapper.addEventListener("toggle:change", (e) => {
    document.body.classList.toggle("menu-open", !!e.detail.isEnabled);
  });

  // 3. DOM MANIPULATION
  const moveToMobileLocation = () => {
    if (!headerInner) {
      console.warn("⚠️ No header-inner found to move menuWrapper relative to.");
      return;
    }
    // Efficiently move if not already there
    if (headerInner.nextSibling !== menuWrapper) {
      headerInner.parentNode.insertBefore(menuWrapper, headerInner.nextSibling);
    }
  };

  const restoreToDesktopLocation = () => {
    if (!originalParent) return;
    // Efficiently move back using the sibling reference
    if (menuWrapper.nextSibling !== originalNextSibling || menuWrapper.parentNode !== originalParent) {
      originalParent.insertBefore(menuWrapper, originalNextSibling);
    }
  };

  // 4. BREAKPOINT HANDLER
  const handleBreakpointChange = (e) => {
    const isMobile = e.matches;
    
    // Toggle primary state classes
    menuWrapper.classList.toggle("mobile", isMobile);
    menuWrapper.classList.toggle("desktop", !isMobile);

    if (isMobile) {
      const isOffCanvas = mobileMenuMode === "Off Canvas";
      const isReveal = mobileMenuMode === "Reveal";
      
      menuWrapper.classList.toggle("off-canvas-mode", isOffCanvas);
      menuWrapper.classList.toggle("reveal-mode", isReveal);

      if (isOffCanvas) moveToMobileLocation();
      
      if (isOffCanvas) {
        menuWrapper.setAttribute("role", "dialog");
        menuWrapper.setAttribute("aria-modal", "true");
      } else {
        menuWrapper.removeAttribute("role");
        menuWrapper.removeAttribute("aria-modal");
      }
      
      menuWrapper.dispatchEvent(new CustomEvent("menuWrapper:mobile"));
    } else {
      // Desktop: close menu if any toggle targeting this wrapper is on
      const wrapperId = menuWrapper.id;
      if (wrapperId && typeof window.Toggles !== "undefined") {
        const togglesForThisMenu = window.Toggles.findByTarget(wrapperId) || [];
        togglesForThisMenu.forEach((t) => {
          if (t.isEnabled) t.disable();
        });
      }
      // Desktop Cleanup
      menuWrapper.classList.remove("off-canvas-mode", "reveal-mode");
      menuWrapper.removeAttribute("role");
      menuWrapper.removeAttribute("aria-modal");
      restoreToDesktopLocation();
      menuWrapper.dispatchEvent(new CustomEvent("menuWrapper:desktop"));
    }
  };

  // 5. ACTIVE LINK DETECTION
  // Marks navigation links matching the current URL with an "active" class
  const nav = menuWrapper.querySelector('nav');
  
  const setActiveLink = () => {
    if (!nav) return;
    
    const currentUrl = new URL(window.location.href);
    let currentPath = currentUrl.pathname;
    
    // Normalize: strip trailing slash except for root
    if (currentPath.length > 1 && currentPath.endsWith('/')) {
      currentPath = currentPath.slice(0, -1);
    }
    
    // Query links only within the nav element
    const links = nav.querySelectorAll('a[href]');
    
    links.forEach(link => {
      const href = link.getAttribute('href');
      
      // Skip non-navigable links
      if (!href || href === '#' || href.startsWith('javascript:') || href.startsWith('mailto:') || href.startsWith('tel:')) {
        return;
      }
      
      try {
        // Resolve link href relative to the current origin
        const linkUrl = new URL(href, window.location.origin);
        
        // Only process links within the same origin
        if (linkUrl.origin !== currentUrl.origin) return;
        
        let linkPath = linkUrl.pathname;
        
        // Apply same normalization as currentPath
        if (linkPath.length > 1 && linkPath.endsWith('/')) {
          linkPath = linkPath.slice(0, -1);
        }
        
        // Match and apply active class
        if (linkPath === currentPath) {
          link.classList.add('active-link');
        } else {
          link.classList.remove('active-link');
        }
      } catch (e) {
        // Silently skip malformed URLs
        return;
      }
    });
  };

  // 6. INITIALIZE (Run immediately to prevent FOUC)
  handleBreakpointChange(mediaQuery);
  setActiveLink(); // Set initial active state
  menuWrapper.setAttribute("data-menu-initialized", "true");
  mediaQuery.addEventListener("change", handleBreakpointChange);
}

</script>
<script type="module">
// ============================================
// Toggle Component (Multi-Toggle Sync Edition)
// ============================================
//
// Wires up buttons with class "toggle" to enable/disable a target element,
// manage focus, ESC handling, scroll freeze, nested dropdown closing,
// and supports optional toggle labels (alternate mode) with
// accessible ARIA-friendly width handling.
//
// NOW SUPPORTS: Multiple toggles targeting the same element with synced states
// NOW SUPPORTS: data-target-is-modal="true" to add role="dialog" and aria-modal="true"
//
// Adds a global API:
//
//   window.allToggleInstances : ToggleInstance[]
//   window.Toggles : {
//     getAll(): ToggleInstance[],
//     findById(id: string): ToggleInstance | null,
//     findByTarget(targetId: string): ToggleInstance[],
//   }
//
// ============================================

(function() {
    "use strict";

    // --------------------------------------------
    // GLOBAL STATE & SHARED HELPERS
    // --------------------------------------------
    const allToggleInstances = [];
    const toggleStates = new Map(); // Map<buttonId, boolean>
    const targetToTogglesMap = new Map(); // Map<targetId, Toggle[]>

    let scrollFreezeCount = 0;
    let toggleIdCounter = 0;

    /**
     * Toggles the scroll-locked class and overflow styles on the body.
     * Uses a counter to handle multiple overlapping scroll-frozen elements.
     */
    function setScrollFreeze(freeze) {
        if (freeze) {
            scrollFreezeCount++;
        } else {
            scrollFreezeCount = Math.max(0, scrollFreezeCount - 1);
        }

        if (scrollFreezeCount > 0) {
            document.body.classList.add("scroll-locked");
            document.body.style.overflow = "hidden";
            document.body.style.overscrollBehavior = "none";
        } else {
            document.body.classList.remove("scroll-locked");
            document.body.style.overflow = "";
            document.body.style.overscrollBehavior = "";
        }
    }

    function isElementFocusable(element) {
        if (!element) return false;
        const styles = window.getComputedStyle(element);
        return (
            styles.visibility !== "hidden" &&
            styles.display !== "none" &&
            element.offsetParent !== null
        );
    }

    function getFocusableElements(container) {
        return Array.from(
            container.querySelectorAll(
                'a[href], button:not([disabled]), input:not([disabled]), ' +
                'select:not([disabled]), textarea:not([disabled]), ' +
                '[tabindex]:not([tabindex="-1"])'
            )
        ).filter(isElementFocusable);
    }

    function closeDropdownsInContainer(container) {
        if (!container) return;
        const registry = Array.isArray(window.allDropdownInstances)
            ? window.allDropdownInstances
            : null;
        if (!registry) return;

        registry.forEach((instance) => {
            const dropdownEl = instance.dropdown;
            if (!dropdownEl || !container.contains(dropdownEl)) return;

            if (typeof instance.isOpen === "function" && !instance.isOpen()) return;

            if (typeof instance.close === "function") {
                instance.close(true);
            } else {
                dropdownEl.classList.remove("is-open", "open", "active");
                if (instance.trigger) {
                    instance.trigger.setAttribute("aria-expanded", "false");
                    instance.trigger.classList.remove("is-open", "open", "active");
                }
            }
        });
    }

    // --------------------------------------------
    // TOGGLE CLASS
    // --------------------------------------------
    class Toggle {
        constructor(button) {
            this.button = button;
            this.id = button.id || `toggle-${++toggleIdCounter}`;
            if (!button.id) this.button.id = this.id;

            // Configuration extraction
            const ds = button.dataset;
            this.config = {
                targetId: ds.targetElement || null,
                targetToggledClass: ds.targetToggledClass || null,
                freezeScroll: ds.freezeScroll === "true",
                labelMode: (ds.labelMode || "single").toLowerCase(),
                nextFocusId: ds.nextFocusItem || null,
                targetIsModal: ds.targetIsModal === "true",
            };

            this.target = this.config.targetId ? document.getElementById(this.config.targetId) : null;
            
            // Label mode initialization (sync with original behavior)
            if (this.config.labelMode === "alternate") {
                this._initLabels();
            }
            
            // Initialization
            this._initAria();
            this._initTarget();
            this._bindEvents();

            // Registry
            allToggleInstances.push(this);
            if (this.config.targetId) {

            if (!labelWrapper) return;

            const labelOff = labelWrapper.querySelector(".label-off");

            if (!currentLabel) return;

        on(eventName, handler) {

        off(eventName, handler) {

        }

        getConfig() {
            return { ...this.config };
        }

    // --------------------------------------------
    // INITIALIZATION & GLOBAL API
    // --------------------------------------------
    const toggleButtons = document.querySelectorAll("button.toggle");
    if (toggleButtons.length === 0) {
        console.warn("⚠️ No toggle buttons found on this page.");
    }

    toggleButtons.forEach(btn => new Toggle(btn));

    // Recalculate label widths on resize
    let resizeRafId = null;
    window.addEventListener("resize", () => {
