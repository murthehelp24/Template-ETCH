<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page — preview</title>
<link rel="stylesheet" href="assets/acss-sim.css">
<style>
:where([data-etch-element="section"]) {
  inline-size: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
}

:where([data-etch-element="container"]) {
  inline-size: 100%;
  display: flex;
  flex-direction: column;
  max-inline-size: var(--content-width, 1366px);
  align-self: center; margin-inline: auto;
}

:where(:root) {
  /* ===== MAIN TEMPLATE COLOURS — change colours here only =====
     Header, footer and every main-* section use these variables.
     By default they follow ACSS: changing Primary / Secondary in ACSS changes the templates too. */
  --main-primary: var(--primary, #1e3a5f);    /* brand: header, footer, FAQ, headings, links, tags */
  --main-accent: var(--secondary, #e8a33d);   /* highlight: underlines, hover, eyebrow line, active */
  --main-light: var(--white, #fff);           /* light backgrounds: sections, cards, article box */
  --main-text: var(--text-dark, #1a1a1a);     /* text on light backgrounds */
  --main-on-primary: var(--white, #fff);      /* text and icons on the primary colour */

  /* derived from the five colours above — no need to edit */
  --main-light-alt: color-mix(in srgb, var(--main-primary) 6%, var(--main-light));
  --main-text-muted: color-mix(in srgb, var(--main-text) 72%, transparent);
  --main-on-primary-muted: color-mix(in srgb, var(--main-on-primary) 78%, transparent);
  --main-line: color-mix(in srgb, var(--main-primary) 18%, transparent);
  --main-line-on-primary: color-mix(in srgb, var(--main-on-primary) 18%, transparent);
  --main-accent-soft: color-mix(in srgb, var(--main-accent) 20%, var(--main-light));
  --main-shadow: color-mix(in srgb, var(--main-text) 12%, transparent);
}

:root:has(.main-header) {
  /* Colours come from the main colours (:where(:root)) — change them there.
     Declared on :root because the mobile drawer is moved to <body> when it opens. */
  --main-header-logo-height: 40px;

  @media (width <= 768px) {
    --main-header-logo-height: 32px;
  }
}

.main-header {
  pointer-events: none;
  z-index: 50;
  padding: 0;

  > * {
    pointer-events: auto;
  }

  /* position (data attributes on this element) */
  &[data-overlay-header='true'],
  &[data-sticky-header='true'] {
    inset-block-start: var(--wp-admin--admin-bar--height, 0px);
  }

  &[data-overlay-header='true'] {
    position: absolute;
  }

  &[data-sticky-header='true'] {
    position: sticky;
  }

  &[data-sticky-header='true'][data-overlay-header='true'] {
    position: fixed;
  }

  &[data-overlay-header='true'][data-overlay-header-offset='true'] + main > :first-child > :first-child {
    margin-block-start: var(--header-height);
  }

  &[data-hide-on-scroll='true'] .main-header__bar {
    transition: transform 0.4s cubic-bezier(0.55, 0, 0.1, 1);
  }

  &.hide .main-header__bar {
    transform: translateY(-100%);
  }

  /* ACSS gives every <button> outside a <nav> button typography — keep menu buttons like links */
  button.main-header__link {
    font-weight: inherit;
    font-family: inherit;
    line-height: inherit;
    letter-spacing: inherit;
    text-transform: none;
  }

  .skip-link {
    position: absolute;
    top: -1500px;
    left: 32px;
    z-index: 999;
    background: var(--main-light);
    color: var(--main-text);

    &:focus-visible {
      top: 32px;
    }
  }
}

.main-header__bar {
  inline-size: 100%;
  padding: var(--space-xs) var(--gutter);
  background-color: var(--main-primary);
  color: var(--main-on-primary);
  border-block-end: 1px solid var(--main-line-on-primary);
}

.main-header__container {
  flex-direction: row;
  justify-content: space-between;
  align-items: center;
  gap: var(--space-m);

  /* desktop nav (Oh My Etch root) fills the middle so the links sit centred.
     Styled from here: Etch drops class-prop ids on paste for the Nav's styling group. */
  > [data-ome-nav-menu-root] {
    flex: 1 1 auto;

    @media (width <= 1199px) {
      display: none;
    }
  }

  @media (width >= 1200px) {
    > [data-ome-mobile-nav-root] {
      display: none;
    }
  }
}

.main-header__logo {
  display: flex;
  flex-shrink: 0;
}

.main-header__logo-img {
  block-size: var(--main-header-logo-height);
  inline-size: auto;
  max-inline-size: 100%;
  object-fit: contain;
}

.main-header__nav-list {
  justify-content: center;
  align-items: center;
  gap: var(--space-xs);
}

.main-header__link {
  position: relative;
  display: inline-flex;
  align-items: center;
  gap: 0.25em;
  padding: var(--btn-padding-block, 0.75em) var(--btn-padding-inline, 1em);
  background: none;
  border: 0;
  font: inherit;
  font-size: var(--text-s);
  line-height: 1;
  white-space: nowrap;
  color: var(--main-on-primary);
  text-decoration: none;
  cursor: pointer;

  /* animated underline */
  &::after {
    content: '';
    position: absolute;
    inset-inline: var(--btn-padding-inline, 1em);
    inset-block-end: 0.35em;
    block-size: 2px;
    background-color: var(--main-accent);
    transform: scaleX(0);
    transform-origin: left;
    transition: transform 0.25s ease;
  }

  &:hover::after,
  &[aria-current='page']::after,
  &[aria-expanded='true']::after {
    transform: scaleX(1);
  }

  [data-ome-nav-menu-trigger-chevron] {
    transition: rotate 0.2s ease;
  }

  &[aria-expanded='true'] [data-ome-nav-menu-trigger-chevron] {
    rotate: 180deg;
  }
}

.main-header__dropdown {
  display: flex;
  flex-direction: column;
  min-inline-size: 220px;
  padding-block: var(--space-xs);
  background-color: var(--main-primary);
  border-block-start: 3px solid var(--main-accent);
  box-shadow: 0 16px 36px var(--main-shadow);
  transition: opacity 0.15s ease, translate 0.15s ease;

  &[data-ome-state='closed'] {
    opacity: 0;
    translate: 0 8px;
  }
}

.main-header__dropdown-link {
  display: block;
  padding: 0.6em 1.25em;
  font-size: var(--text-s);
  line-height: 1.3;
  white-space: nowrap;
  color: var(--main-on-primary);
  text-decoration: none;
  transition: background-color 0.15s ease;

  &:not(:last-child) {
    box-shadow: inset 0 -1px 0 var(--main-line-on-primary);
  }

  &:hover,
  &:focus-visible {
    background-color: var(--main-accent);
  }

  &:focus-visible {
    outline: 2px solid var(--main-on-primary);
    outline-offset: -2px;
  }
}

.main-header__actions {
  display: flex;
  align-items: center;
  gap: var(--space-xs);
  flex-shrink: 0;

  /* tablet: keep the buttons next to the hamburger */
  @media (width <= 1199px) {
    margin-inline-start: auto;
  }

  @media (width <= 768px) {
    display: none;
  }
}

.main-header__burger {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-inline-size: 44px;
  min-block-size: 44px;
  padding: 0;
  background: none;
  border: 0;
  color: var(--main-on-primary);
  cursor: pointer;

  svg {
    inline-size: 28px;
    block-size: 28px;
  }
}

.main-header__drawer {
  --ome-drawer-overlay-color: color-mix(in srgb, var(--main-text) 60%, transparent);
  --ome-drawer-animation-duration: 250ms;
  inline-size: min(360px, 85vw);
  padding-block-start: var(--wp-admin--admin-bar--height, 0px);
  background-color: var(--main-primary);
  color: var(--main-on-primary);
  border-block-start: 3px solid var(--main-accent);

  /* ACSS gives every <button> outside a <nav> button typography — keep menu buttons like links */
  .main-header__mobile-link,
  .main-header__drawer-button {
    font-weight: inherit;
    font-family: inherit;
    line-height: inherit;
    letter-spacing: inherit;
    text-transform: none;
  }
}

.main-header__drawer-content {
  --_min-width: 100%;
  --_min-height: 100dvh;
  --_background: var(--main-primary);
  --_color: var(--main-on-primary);
  --_panel-background: var(--main-primary);
}

.main-header__drawer-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--space-xs);
  padding: var(--space-xs) var(--gutter);
  border-block-end: 1px solid var(--main-line-on-primary);
}

.main-header__drawer-button {
  display: inline-flex;
  align-items: center;
  gap: 0.375em;
  min-inline-size: 44px;
  min-block-size: 44px;
  margin-inline-start: auto;
  padding: 0;
  background: none;
  border: 0;
  font: inherit;
  color: inherit;
  cursor: pointer;

  &[data-ome-mobile-nav-back] {
    margin-inline-start: 0;
  }
}

.main-header__mobile-list {
  display: grid;
  padding-inline: var(--gutter);
}

.main-header__mobile-item {
  display: flex;
  align-items: stretch;
  border-block-end: 1px solid var(--main-line-on-primary);
}

.main-header__mobile-link {
  display: flex;
  align-items: center;
  justify-content: space-between;
  inline-size: 100%;
  min-block-size: 48px;
  padding-block: var(--space-xs);
  padding-inline: 0;
  background: none;
  border: 0;
  font: inherit;
  text-align: start;
  color: var(--main-on-primary);
  text-decoration: none;
  cursor: pointer;

  &:hover,
  &:focus-visible {
    color: var(--main-accent);
  }
}

.main-header__next-icon {
  display: inline-flex;
  inline-size: 1em;
  block-size: 1em;
  flex-shrink: 0;
}

.main-header__mobile-slot {
  display: flex;
  flex-direction: column;
  gap: var(--space-xs);
  padding: var(--space-m) var(--gutter);
}

iewport] > [data-ome-nav-menu-content][data-ome-motion="to-start"] { animation: ome-nav-menu-exit-to-start 150ms ease; } &[data-ome-use-animated-menu="true"] > [data-ome-nav-menu-viewport][data-ome-full-width="true"] > [data-ome-nav-menu-content][data-ome-motion="to-start"] { animation: none; } &[data-ome-use-animated-menu="true"] > [data-ome-nav-menu-viewport][data-ome-full-width="true"] > [data-ome-nav-menu-content][data-ome-motion="to-start"] > [data-ome-nav-menu-motion-layer] { animation: ome-nav-menu-exit-to-start 150ms ease; } &[data-ome-use-animated-menu="true"] > [data-ome-nav-menu-viewport] > [data-ome-nav-menu-content][data-ome-motion="to-end"] { animation: ome-nav-menu-exit-to-end 150ms ease; } &[data-ome-use-animated-menu="true"] > [data-ome-nav-menu-viewport][data-ome-full-width="true"] > [data-ome-nav-menu-content][data-ome-motion="to-end"] { animation: none; } &[data-ome-use-animated-menu="true"] > [data-ome-nav-menu-viewport][data-ome-full-width="true"] > [data-ome-nav-menu-content][data-ome-motion="to-end"] > [data-ome-nav-menu-motion-layer] { animation: ome-nav-menu-exit-to-end 150ms ease; } &[data-ome-use-animated-menu="true"] > [data-ome-nav-menu-viewport]:not([data-ome-full-width="true"]) > [data-ome-nav-menu-content][data-ome-motion] { animation: none; } &[data-ome-use-animated-menu="true"] > [data-ome-nav-menu-viewport]:not([data-ome-full-width="true"]) > [data-ome-nav-menu-content] { transition: none; } & [data-ome-nav-menu-trigger-chevron] { transition: transform var(--transition-duration, 250ms) ease; } & [data-ome-nav-menu-trigger][data-ome-state="open"] [data-ome-nav-menu-trigger-chevron] { transform: rotate(180deg); }

  min-inline-size: 0

:where([data-ome-mobile-nav-root])

.main-header--light {
  /* light bar: dark text on the light colour, primary button */
  .main-header__bar {
    background-color: var(--main-light);
    color: var(--main-text);
    border-block-end-color: var(--main-line);
    box-shadow: 0 2px 12px var(--main-shadow);
  }

  .main-header__link,
  .main-header__burger {
    color: var(--main-text);
  }

  .main-header__link::after {
    background-color: var(--main-primary);
  }

  .main-header__dropdown {
    background-color: var(--main-light);
    border-block-start-color: var(--main-primary);
  }

  .main-header__dropdown-link {
    color: var(--main-text);

    &:not(:last-child) {
      box-shadow: inset 0 -1px 0 var(--main-line);
    }

    &:hover,
    &:focus-visible {
      background-color: var(--main-light-alt);
      color: var(--main-primary);
    }

    &:focus-visible {
      outline-color: var(--main-primary);
    }
  }
}

.main-header--center {
  /* desktop: logo centred on the first row, buttons on its right, menu centred on the row below */
  @media (width >= 1200px) {
    --main-header-logo-height: 52px;

    .main-header__container {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      row-gap: var(--space-xs);
    }

    .main-header__logo {
      grid-column: 2;
      grid-row: 1;
      justify-self: center;
    }

    .main-header__actions {
      grid-column: 3;
      grid-row: 1;
      justify-self: end;
    }

    .main-header__container > [data-ome-nav-menu-root] {
      grid-column: 1 / -1;
      grid-row: 2;
      padding-block-start: var(--space-xs);
      border-block-start: 1px solid var(--main-line-on-primary);
    }
  }
}

.main-header--topbar {
  /* a thin info strip above the bar (inside it, so hide-on-scroll moves both) */
  .main-header__topbar {
    margin-block: calc(var(--space-xs) * -1) var(--space-xs);
    margin-inline: calc(var(--gutter) * -1);
    padding: 0.5em var(--gutter);
    background-color: var(--main-light-alt);
    color: var(--main-text);
    font-size: var(--text-xs, var(--text-s));
    line-height: 1.4;
  }

  .main-header__topbar-inner {
    display: flex;
    inline-size: 100%;
    max-inline-size: var(--content-width, 1366px);
    margin-inline: auto;
    flex-wrap: wrap;
    justify-content: space-between;
    align-items: center;
    gap: 0.25em var(--space-m);
  }

  .main-header__topbar-group {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 0.25em var(--space-m);
  }

  .main-header__topbar-item {
    display: inline-flex;
    align-items: center;
    gap: 0.5em;
    color: inherit;
    text-decoration: none;

    svg {
      inline-size: 1.1em;
      block-size: 1.1em;
      flex: 0 0 auto;
      color: var(--main-primary);
    }
  }

  a.main-header__topbar-item:hover {
    color: var(--main-primary);
    text-decoration: underline;
  }

  /* phones: the hours and phone only */
  @media (width <= 768px) {
    .main-header__topbar-inner {
      justify-content: center;
    }

    .main-header__topbar-group--extra,
    .main-header__topbar-item--address {
      display: none;
    }
  }
}

.main-header--floating {
  /* the bar floats: a rounded, shadowed band with space around it; round buttons to match */
  .main-header__bar {
    background-color: transparent;
    border-block-end: 0;
    padding-block: var(--space-s);
  }

  .main-header__container {
    padding: var(--space-xs) var(--space-xs) var(--space-xs) var(--space-l);
    background-color: var(--main-primary);
    border-radius: 999px;
    box-shadow: 0 10px 30px var(--main-shadow);

    @media (width <= 768px) {
      padding-inline: var(--space-m) var(--space-xs);
    }
  }

  .main-header__actions > a {
    border-radius: 999px;
  }
}

.main-header--right {
  /* menu on the right, next to the button */
  .main-header__bar {
    padding-block: var(--space-s);
  }

  .main-header__nav-list {
    justify-content: flex-end;
  }
}

.main-heading {
  display: flex;
  flex-direction: column;
  gap: var(--space-xs);
  max-inline-size: calc(600 * 1rem / var(--etch-root-px, 10));
}

.main-heading--center {
  align-items: center;
  margin-inline: auto;
  text-align: center;
}

.main-heading__eyebrow {
  display: flex;
  align-items: center;
  gap: var(--space-xs);
  font-size: var(--text-s);
  font-weight: 600;
  letter-spacing: 0.08em;
  color: var(--main-primary);

  &::before {
    content: "";
    inline-size: calc(24 * 1rem / var(--etch-root-px, 10));
    block-size: 2px;
    background-color: var(--main-accent);
  }
}

.main-heading__intro {
  color: var(--main-text-muted);
}

.main-media__img {
  /* image ratio: set --main-media-ratio on a parent */
  display: block;
  inline-size: 100%;
  block-size: auto;
  aspect-ratio: var(--main-media-ratio, 4 / 3);
  border-radius: var(--radius-m);
  background-color: var(--main-light-alt);
  object-fit: cover;
}

.main-buttons {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: var(--space-s);
}

.main-checks {
  display: flex;
  flex-direction: column;
  gap: var(--space-xs);
  margin: 0;
  padding: 0;
  list-style: none;
}

.main-checks__item {
  display: flex;
  align-items: flex-start;
  gap: var(--space-xs);
}

.main-checks__icon {
  flex: none;
  inline-size: calc(24 * 1rem / var(--etch-root-px, 10));
  block-size: calc(24 * 1rem / var(--etch-root-px, 10));
  padding: calc(var(--space-xs) / 2);
  border-radius: 50%;
  background-color: var(--main-accent-soft);
  color: var(--main-primary);
}

.main-hero {
  padding-block: var(--section-space-l);
  background-color: var(--main-light-alt);
}

.main-hero__grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(min(100%, calc(400 * 1rem / var(--etch-root-px, 10))), 1fr));
  gap: var(--container-gap);
  align-items: center;
}

.main-hero__content {
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: var(--content-gap);
}

.main-hero__media {
  --main-media-ratio: 5 / 4;
  margin: 0;
}

.main-hero-image {
  position: relative;
  isolation: isolate;
  overflow: hidden;
  justify-content: center;
  min-block-size: calc(800 * 1rem / var(--etch-root-px, 10)); /* same height as the colour-panel hero */
  padding-block: var(--section-space-xl);

  &::before {
    content: "";
    position: absolute;
    inset: 0;
    z-index: -1;
    background: color-mix(in srgb, var(--main-primary) 78%, transparent);
  }

  @media (width <= 768px) {
    min-block-size: calc(600 * 1rem / var(--etch-root-px, 10));
  }

  color: var(--main-on-primary);

  :is(h1, h2, h3, h4, h5, h6),
  .main-heading__eyebrow {
    color: inherit;
  }

  .main-heading__intro {
    color: var(--main-on-primary-muted);
  }

  .main-buttons {
    justify-content: center;
  }

  /* trust points in one row under the buttons */
  .main-checks {
    flex-direction: row;
    flex-wrap: wrap;
    justify-content: center;
    gap: var(--space-xs) var(--space-l);
    margin-block-start: var(--space-s);
  }
}

.main-hero-image__bg {
  position: absolute;
  inset: 0;
  z-index: -2;
  margin: 0;
}

.main-hero-image__img {
  display: block;
  inline-size: 100%;
  block-size: 100%;
  object-fit: cover;
  background-color: var(--main-primary);
}

.main-hero-image__content {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: var(--content-gap);
  max-inline-size: calc(960 * 1rem / var(--etch-root-px, 10));
  margin-inline: auto;
  text-align: center;
}

.main-hero-gradient {
  position: relative;
  isolation: isolate;
  overflow: hidden;
  justify-content: center;
  min-block-size: calc(800 * 1rem / var(--etch-root-px, 10)); /* same height as the colour-panel hero */
  padding-block: var(--section-space-xl);

  &::before {
    content: "";
    position: absolute;
    inset: 0;
    z-index: -1;
    background: linear-gradient(
      90deg,
      color-mix(in srgb, var(--main-primary) 92%, transparent) 0%,
      color-mix(in srgb, var(--main-primary) 64%, transparent) 40%,
      color-mix(in srgb, var(--main-primary) 0%, transparent) 75%
    );
  }

  /* phones: the text covers the photo, so darken it evenly */
  @media (width <= 768px) {
    min-block-size: calc(600 * 1rem / var(--etch-root-px, 10));

    &::before {
      background: color-mix(in srgb, var(--main-primary) 80%, transparent);
    }
  }

  color: var(--main-on-primary);

  :is(h1, h2, h3, h4, h5, h6),
  .main-heading__eyebrow {
    color: inherit;
  }

  .main-heading__intro {
    color: var(--main-on-primary-muted);
  }
}

.main-hero-gradient__bg {
  position: absolute;
  inset: 0;
  z-index: -2;
  margin: 0;
}

.main-hero-gradient__img {
  display: block;
  inline-size: 100%;
  block-size: 100%;
  object-fit: cover;
  background-color: var(--main-primary);
}

.main-hero-gradient__content {
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: var(--content-gap);
  max-inline-size: calc(640 * 1rem / var(--etch-root-px, 10));
}

.main-hero-collage {
  padding-block: var(--section-space-l);
  background-color: var(--main-light);
}

.main-hero-collage__grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(min(100%, calc(440 * 1rem / var(--etch-root-px, 10))), 1fr));
  gap: var(--container-gap);
  align-items: center;
}

.main-hero-collage__content {
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: var(--content-gap);
}

.main-hero-collage__stats {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: var(--space-m);
  inline-size: 100%;
  margin: var(--space-s) 0 0;
  padding-block-start: var(--space-m);
  border-block-start: 1px solid var(--main-line);
}

.main-hero-collage__stat {
  display: flex;
  flex-direction: column;
  gap: calc(4 * 1rem / var(--etch-root-px, 10));
  margin: 0;
}

.main-hero-collage__value {
  font-size: var(--h3);
  font-weight: 800;
  line-height: 1.1;
  color: var(--main-primary);
}

.main-hero-collage__label {
  margin: 0;
  font-size: var(--text-s);
  color: var(--main-text-muted);
}

.main-hero-collage__media {
  /* one tall photo on the left, two stacked on the right */
  position: relative;
  display: grid;
  grid-template-columns: 3fr 2fr;
  grid-template-rows: repeat(2, minmax(0, 1fr));
  gap: var(--space-s);
  aspect-ratio: 1 / 1;
  margin: 0;

  .main-media__img {
    block-size: 100%;
    aspect-ratio: auto;
    border-radius: var(--radius-l);
  }

  > :first-child {
    grid-row: 1 / -1;
  }
}

.main-hero-collage__badge {
  position: absolute;
  inset-inline-start: calc(var(--space-m) * -1);
  inset-block-end: var(--space-l);
  display: flex;
  align-items: center;
  gap: var(--space-s);
  padding: var(--space-s) var(--space-m);
  border-radius: var(--radius-m);
  background-color: var(--main-light);
  box-shadow: 0 calc(16 * 1rem / var(--etch-root-px, 10)) calc(40 * 1rem / var(--etch-root-px, 10)) var(--main-shadow);

  @media (width <= 768px) {
    inset-inline-start: var(--space-xs);
    inset-block-end: var(--space-xs);
  }
}

.main-hero-collage__badge-icon {
  flex: none;
  inline-size: calc(48 * 1rem / var(--etch-root-px, 10));
  block-size: calc(48 * 1rem / var(--etch-root-px, 10));
  padding: calc(11 * 1rem / var(--etch-root-px, 10));
  border-radius: 50%;
  background-color: var(--main-accent);
  color: var(--main-on-primary);
}

.main-hero-collage__badge-text {
  display: flex;
  flex-direction: column;
  font-size: var(--text-s);
  color: var(--main-text-muted);
}

.main-hero-collage__badge-value {
  font-size: var(--h4);
  font-weight: 800;
  line-height: 1.2;
  color: var(--main-text);
}

.main-hero-panel {
  padding: 0;
  overflow: hidden;
  background-color: var(--main-primary);
  color: var(--main-on-primary);

  :is(h1, h2, h3, h4, h5, h6),
  .main-heading__eyebrow {
    color: inherit;
  }

  .main-heading__intro {
    color: var(--main-on-primary-muted);
  }
}

.main-hero-panel__grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  inline-size: 100%;
  min-block-size: calc(800 * 1rem / var(--etch-root-px, 10)); /* same height as the full-image heroes */

  @media (width <= 992px) {
    grid-template-columns: 1fr;
  }
}

.main-hero-panel__content {
  /* lines up with the page container on the left */
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: flex-start;
  gap: var(--content-gap);
  padding-block: var(--section-space-l);
  padding-inline: max(var(--gutter), calc((100vw - var(--content-width, 1366px)) / 2)) var(--space-xl);

  @media (width <= 992px) {
    padding-inline: var(--gutter);
  }
}

.main-hero-panel__media {
  margin: 0;
  overflow: hidden;
  border-end-start-radius: calc(120 * 1rem / var(--etch-root-px, 10));
  background-color: var(--main-light-alt);

  @media (width <= 992px) {
    aspect-ratio: 4 / 3;
    border-end-start-radius: 0;
    border-start-start-radius: calc(60 * 1rem / var(--etch-root-px, 10));
  }
}

.main-hero-panel__img {
  display: block;
  inline-size: 100%;
  block-size: 100%;
  object-fit: cover;
}

.main-band {
  background-color: var(--main-primary);
  color: var(--main-on-primary);

  :is(h1, h2, h3, h4, h5, h6),
  .main-heading__eyebrow {
    color: inherit;
  }

  .main-heading__intro {
    color: var(--main-on-primary-muted);
  }
}

.main-page-hero {
  padding-block: var(--section-space-m);
}

.main-page-hero__container {
  align-items: center;
  gap: var(--space-s);
  text-align: center;
}

.main-breadcrumb {
  font-size: var(--text-s);

  ol {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: var(--space-xs);
    margin: 0;
    padding: 0;
    list-style: none;
  }

  li:not(:last-child)::after {
    content: "/";
    margin-inline-start: var(--space-xs);
    opacity: 0.6;
  }

  a {
    color: inherit;
    text-decoration: none;

    &:hover {
      text-decoration: underline;
      text-decoration-color: var(--main-accent);
    }
  }

  [aria-current] {
    opacity: 0.8;
  }

  grid-template-columns: repeat(auto-fit, minmax(min(100%, calc(180 * 1rem / var(--etch-root-px, 10))), 1fr));
  gap: var(--grid-gap);
  margin: 0;
  padding: 0;
  list-style: none;
  text-align: center;
}

.main-stats-image__item {
  display: flex;
  flex-direction: column;
  gap: var(--space-xs);
  padding: var(--space-m) var(--space-s);
  border: 1px solid var(--main-line-on-primary);
  border-radius: var(--radius-m);
}

.main-stats-image__number {
  margin: 0;
  font-size: var(--h1);
  font-weight: 800;
  line-height: 1;
  color: var(--main-accent);
}

.main-stats-image__label {
  margin: 0;
  color: var(--main-on-primary-muted);
}

.main-steps {
  background-color: var(--main-light-alt);
}

.main-steps__container {
  gap: var(--container-gap);
}

.main-steps__list {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(min(100%, calc(220 * 1rem / var(--etch-root-px, 10))), 1fr));
  gap: var(--grid-gap);
  margin: 0;
  padding: 0;
  list-style: none;
  counter-reset: main-step;
}

.main-steps__item {
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: var(--space-xs);
  counter-increment: main-step;

  /* step number — added automatically, in order */
  &::before {
    content: counter(main-step, decimal-leading-zero);
    display: grid;
    place-items: center;
    inline-size: calc(56 * 1rem / var(--etch-root-px, 10));
    block-size: calc(56 * 1rem / var(--etch-root-px, 10));
    margin-block-end: var(--space-xs);
    border-radius: 50%;
    background-color: var(--main-primary);
    box-shadow: 0 0 0 calc(6 * 1rem / var(--etch-root-px, 10)) var(--main-accent-soft);
    color: var(--main-on-primary);
    font-size: var(--text-l);
    font-weight: 800;
  }
}

.main-steps__title {
  font-size: var(--h4);
  color: var(--main-text);
}

.main-steps__text {
  color: var(--main-text-muted);
}

.main-steps-line {
  background-color: var(--main-light);
}

.main-steps-line__container {
  gap: var(--container-gap);
}

.main-steps-line__list {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: var(--grid-gap);
  margin: 0;
  padding: 0;
  list-style: none;
  counter-reset: main-step-line;
  text-align: center;

  @media (width <= 768px) {
    grid-template-columns: 1fr;
  }
}

.main-steps-line__item {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: var(--space-xs);
  counter-increment: main-step-line;

  &::before {
    content: counter(main-step-line);
    position: relative;
    z-index: 1;
    display: grid;
    place-items: center;
    inline-size: calc(64 * 1rem / var(--etch-root-px, 10));
    block-size: calc(64 * 1rem / var(--etch-root-px, 10));
    margin-block-end: var(--space-xs);
    border: 3px solid var(--main-accent);
    border-radius: 50%;
    background-color: var(--main-light);
    color: var(--main-primary);
    font-size: var(--h4);
    font-weight: 800;
  }

  /* the line joining this circle to the next one */
  &:not(:last-child)::after {
    content: "";
    position: absolute;
    inset-block-start: calc(32 * 1rem / var(--etch-root-px, 10));
    inset-inline-start: 50%;
    inline-size: calc(100% + var(--grid-gap));
    border-block-start: 2px dashed var(--main-line);

    @media (width <= 768px) {
      display: none;
    }
  }
}

.main-steps-line__title {
  margin: 0;
  font-size: var(--h4);
  color: var(--main-text);
}

.main-steps-line__text {
  margin: 0;
  color: var(--main-text-muted);
}

.main-steps-vertical {
  background-color: var(--main-light-alt);
}

.main-steps-vertical__grid {
  display: grid;
  grid-template-columns: minmax(0, 2fr) minmax(0, 3fr);
  gap: var(--container-gap);
  align-items: start;

  @media (width <= 992px) {
    grid-template-columns: 1fr;
  }
}

.main-steps-vertical__intro {
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: var(--content-gap);
}

.main-steps-vertical__list {
  display: flex;
  flex-direction: column;
  margin: 0;
  padding: 0;
  list-style: none;
  counter-reset: main-step-vertical;
}

.main-steps-vertical__item {
  position: relative;
  display: flex;
  gap: var(--space-m);
  padding-block-end: var(--space-l);
  counter-increment: main-step-vertical;

  &::before {
    content: counter(main-step-vertical, decimal-leading-zero);
    flex: none;
    display: grid;
    place-items: center;
    inline-size: calc(56 * 1rem / var(--etch-root-px, 10));
    block-size: calc(56 * 1rem / var(--etch-root-px, 10));
    border-radius: 50%;
    background-color: var(--main-primary);
    color: var(--main-on-primary);
    font-size: var(--text-l);
    font-weight: 800;
  }

  /* the line down to the next step */
  &:not(:last-child)::after {
    content: "";
    position: absolute;
    inset-block: calc(56 * 1rem / var(--etch-root-px, 10)) 0;
    inset-inline-start: calc(27 * 1rem / var(--etch-root-px, 10));
    border-inline-start: 2px solid var(--main-line);
  }

  &:last-child {
    padding-block-end: 0;
  }
}

.main-steps-vertical__body {
  display: flex;
  flex-direction: column;
  gap: var(--space-xs);
  padding-block-start: calc(12 * 1rem / var(--etch-root-px, 10));
}

.main-steps-vertical__title {
  margin: 0;
  font-size: var(--h4);
  color: var(--main-text);
}

.main-steps-vertical__text {
  margin: 0;
  color: var(--main-text-muted);
}

.main-steps-cards {
  background-color: var(--main-light);
}

.main-steps-cards__container {
  gap: var(--container-gap);
}

.main-steps-cards__list {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(min(100%, calc(240 * 1rem / var(--etch-root-px, 10))), 1fr));
  gap: var(--grid-gap);
  margin: 0;
  padding: 0;
  list-style: none;
  counter-reset: main-step-card;
}

.main-steps-cards__item {
  position: relative;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  gap: var(--space-xs);
  padding: calc(96 * 1rem / var(--etch-root-px, 10)) var(--space-m) var(--space-m); /* room for the number */
  border-block-start: 4px solid var(--main-accent);
  border-radius: var(--radius-m);
  background-color: var(--main-light-alt);
  counter-increment: main-step-card;

  &::before {
    content: counter(main-step-card, decimal-leading-zero);
    position: absolute;
    inset-block-start: var(--space-xs);
    inset-inline-end: var(--space-s);
    font-size: calc(80 * 1rem / var(--etch-root-px, 10));
    font-weight: 800;
    line-height: 1;
    color: var(--main-line);
  }
}

.main-steps-cards__title {
  margin: 0;
  font-size: var(--h4);
  color: var(--main-text);
}

.main-steps-cards__text {
  margin: 0;
  color: var(--main-text-muted);
}

.main-steps-band {
  padding-block: var(--section-space-m);
}

.main-steps-band__container {
  gap: var(--container-gap);
}

.main-steps-band__list {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: var(--space-xl);
  margin: 0;
  padding: 0;
  list-style: none;
  counter-reset: main-step-band;

  @media (width <= 992px) {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }

  @media (width <= 600px) {
    grid-template-columns: 1fr;
  }
}

.main-steps-band__item {
  position: relative;
  display: flex;
  flex-direction: column;
  gap: var(--space-xs);
  counter-increment: main-step-band;

  &::before {
    content: "Step " counter(main-step-band);
    align-self: flex-start;
    padding: calc(var(--space-xs) / 2) var(--space-s);
    border-radius: var(--radius-circle, 999px);
    background-color: var(--main-accent);
    color: var(--main-on-primary);
    font-size: var(--text-s);
    font-weight: 700;
  }

  /* arrow pointing to the next step */
  &:not(:last-child)::after {
    content: "→";
    position: absolute;
    inset-block-start: 0;
    inset-inline-end: calc(var(--space-xl) / -2);
    translate: 50% 0;
    font-size: var(--h4);
    color: var(--main-accent);

    @media (width <= 992px) {
      display: none;
    }
  }
}

.main-steps-band__title {
  margin: 0;
  font-size: var(--h4);
  color: inherit;
}

.main-steps-band__text {
  margin: 0;
  color: var(--main-on-primary-muted);
}

.main-reviews {

}

.main-reviews__container {

.main-reviews__grid {

  list-style: none;
}

.main-reviews__quote-icon {

.main-reviews__stars {

    block-size: calc(18 * 1rem / var(--etch-root-px, 10));
  }

.main-reviews__text {
  margin: 0;

}

.main-reviews__author {

}

.main-reviews__name {

  color: var(--main-primary);
}

.main-reviews__meta {

}

.main-reviews-featured {

}

.main-reviews-featured__card {

  text-align: center;
}

.main-reviews-featured__icon {
  inline-size: calc(64 * 1rem / var(--etch-root-px, 10));
  block-size: calc(64 * 1rem / var(--etch-root-px, 10));

}

.main-reviews-featured__stars {
  display: flex;
  gap: calc(var(--space-xs) / 4);

.main-reviews-featured__quote {
  margin: 0;
  padding: 0;
  border: 0;
  font-size: var(--h4);
  font-weight: 500;
  line-height: 1.5;
  color: var(--main-text);

    margin: 0;
  }
}

.main-reviews-featured__author {
  display: flex;
  align-items: center;
  gap: var(--space-s);

}

.main-reviews-featured__photo {
  inline-size: calc(64 * 1rem / var(--etch-root-px, 10));
  block-size: calc(64 * 1rem / var(--etch-root-px, 10));
  border-radius: 50%;
  background-color: var(--main-line);
  object-fit: cover;
}

.main-reviews-featured__who {
  display: flex;
  flex-direction: column;
}

.main-reviews-featured__name {
  font-weight: 700;
  color: var(--main-primary);
}

.main-reviews-featured__meta {
  font-size: var(--text-s);
  color: var(--main-text-muted);
}

.main-reviews-band {
  padding-block: var(--section-space-m);
}

.main-reviews-band__container {
  gap: var(--container-gap);
}

.main-reviews-band__grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(min(100%, calc(280 * 1rem / var(--etch-root-px, 10))), 1fr));
  gap: var(--grid-gap);
  margin: 0;
  padding: 0;
  list-style: none;
}

.main-reviews-band__item {
  display: flex;
  flex-direction: column;
  gap: var(--space-s);
  padding: var(--space-m);
  border: 1px solid var(--main-line-on-primary);
  border-radius: var(--radius-m);
}

.main-reviews-band__stars {
  display: flex;
  gap: calc(var(--space-xs) / 4);
  color: var(--main-accent);

  svg {
    inline-size: calc(18 * 1rem / var(--etch-root-px, 10));
    block-size: calc(18 * 1rem / var(--etch-root-px, 10));
  }
}

.main-reviews-band__text {
  margin: 0;
  padding: 0;
  border: 0;
  color: inherit;

  p {
    margin: 0;
  }
}

.main-reviews-band__author {
  margin-block-start: auto;
  padding-block-start: var(--space-s);
  border-block-start: 1px solid var(--main-line-on-primary);
}

.main-reviews-band__name {
  margin: 0;
  font-weight: 700;
  color: var(--main-accent);
}

.main-reviews-band__meta {
  margin: 0;
  font-size: var(--text-s);
  color: var(--main-on-primary-muted);
}

.main-reviews-split {
  background-color: var(--main-light);
}

.main-reviews-split__grid {
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(0, 2fr);
  gap: var(--container-gap);
  align-items: start;

  @media (width <= 992px) {
    grid-template-columns: 1fr;
  }
}

.main-reviews-split__summary {
  display: flex;
  flex-direction: column;
  gap: var(--space-l);

.main-reviews-split__score {
  display: flex;
  align-items: center;
  gap: var(--space-s);
  padding: var(--space-m);
  border-radius: var(--radius-m);

}

.main-reviews-split__value {
  font-size: var(--h1);

.main-reviews-split__score-text {

  flex-direction: column;

}

.main-reviews-split__stars {
  display: flex;
  gap: calc(var(--space-xs) / 4);
  color: var(--main-accent);

  svg {
    inline-size: calc(18 * 1rem / var(--etch-root-px, 10));

}

.main-reviews-split__count {

.main-faq {

}

.main-faq__container {
  gap: var(--space-l);
}

.main-faq__list {
  display: flex;
  flex-direction: column;
  gap: var(--space-s);
  inline-size: 100%;
  max-inline-size: calc(820 * 1rem / var(--etch-root-px, 10));
  margin-inline: auto;
}

.main-faq__item {
  overflow: hidden;
  background-color: var(--main-primary);
  color: var(--main-on-primary);
  border: 1px solid transparent;
  border-radius: var(--radius-m);
  transition: border-color 0.2s ease;

  &:hover,
  &[open] {
    border-color: var(--main-accent);

  &[open] .main-faq__question::after {
    content: "−";
    background-color: var(--main-accent);
  }

.main-faq__question {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: var(--space-s);
  padding: var(--space-s) var(--space-m);
  font-weight: 600;
  cursor: pointer;

  &::after {
    content: "+";
    display: grid;
    flex: none;
    place-items: center;
    inline-size: calc(32 * 1rem / var(--etch-root-px, 10));
    block-size: calc(32 * 1rem / var(--etch-root-px, 10));
    border-radius: 50%;
    background-color: var(--main-line-on-primary);
    font-size: var(--text-l);
    line-height: 1;
    transition: background-color 0.2s ease;

.main-faq__answer {
  padding: var(--space-s) var(--space-m);
  background-color: var(--main-light);
  color: var(--main-text);

  }
}

.main-social {

  &:focus-visible {
    background-color: var(--main-accent);

}

.main-social__icon {
  display: block;
  inline-size: calc(20 * 1rem / var(--etch-root-px, 10));

.main-cta__list {

.main-cta__link {

.main-btn-icon {

.main-cta__map {

.main-contact__info {

<script>
/* ?t=header,hero,footer → stamp those templates here, in that order (default: header + every section + footer) */
(function () {
  var q = new URLSearchParams(location.search).get('t');
  var ids = q ? q.split(',') : Array.prototype.map.call(document.querySelectorAll('template[id^="tpl-"]'),
    function (t) { return t.id.slice(4); }).filter(function (id) { return !/^(header|footer)-/.test(id); }); // one header, one footer
  var here = document.currentScript;
  ids.forEach(function (id, i) {
    var t = document.getElementById('tpl-' + id);
    if (!t) return;
    var part = t.content.cloneNode(true);
    // frame.js applies the builder's edits per stamped template (?pb=)
    Array.prototype.forEach.call(part.children, function (el) { el.setAttribute('data-pv-inst', i); });
    here.parentNode.insertBefore(part, here);
  });
})();
</script>

<script type="module">
// Select the header element
const header = document.querySelector('.main-header');

// Early exit if header doesn't exist on this page
if (!header) {
  if (window.console) console.warn('Header element (.main-header) not found.');
} else {
  // 1. CONFIGURATION
  // Read once and cache to avoid repeated DOM access
  const ds = header.dataset;
  const config = {
    sticky: ds.stickyHeader === 'true',
    hide: ds.hideOnScroll === 'true',
    up: ds.showOnScrollUp === 'true',
    at: parseInt(ds.hideAt, 10) || 0,
    skipLink: ds.skipLink === 'true'
  };

  // 2. SKIP LINK
  // Add accessible skip link for keyboard navigation
  if (config.skipLink && !header.querySelector('.skip-link')) {
    const skipLink = document.createElement('a');
    skipLink.href = '#main';
    skipLink.className = 'skip-link';
    skipLink.textContent = 'Skip to main content';
    header.insertBefore(skipLink, header.firstChild);

    // Set id on main element
    const main = document.querySelector('main');
    if (main) {
      main.id = 'main';
    }
  }

  // 3. HEADER HEIGHT
  // Using ResizeObserver handles initial load, window resize, and content changes
  // It's more performant and robust than manual event listeners + debounce
  const updateHeight = () => document.documentElement.style.setProperty('--header-height', `${header.offsetHeight}px`);
  
  if (window.ResizeObserver) {
    new ResizeObserver(updateHeight).observe(header);
  } else {
    window.addEventListener('resize', updateHeight);
    window.addEventListener('load', updateHeight);
    updateHeight();
  }

  // 4. SCROLL LOGIC (Merged into single rAF loop)
  // Consolidating all scroll updates into one requestAnimationFrame callback
  // minimizes layout thrashing and synchronizes DOM updates with screen refreshes.
  if (config.sticky) {
    let lastY = window.scrollY;
    let ticking = false;
    let isHidden = false;
    const tolerance = 5; // Ignore tiny scroll movements

    const updateHeader = (forceVisible = false) => {
      const currentY = Math.max(0, window.scrollY); // Normalize for mobile bounce
      
      // Toggle 'scrolling' class based on any scroll from top
      header.classList.toggle('scrolling', currentY > 0);

      // Hide-on-scroll logic
      if (config.hide && config.at > 0) {
        const isMenuOpen = document.body.classList.contains('menu-open');
        const pastThreshold = currentY >= config.at;

        if (isMenuOpen || forceVisible) {
          isHidden = false;
        } else if (config.up) {
          // Mode: responsive to scroll direction past threshold
          if (!pastThreshold) {
            isHidden = false;
          } else {
            const diff = currentY - lastY;
            if (diff > tolerance) {
              isHidden = true; // Hiding because user is scrolling DOWN
            } else if (diff < -tolerance) {
              isHidden = false; // Showing because user is scrolling UP
            }
          }
        } else {
          // Mode: static threshold
          // If initial load, we don't hide immediately even if past threshold
          isHidden = pastThreshold;
        }

        header.classList.toggle('hide', isHidden);

        // Close all open dropdowns when header hides
        if (isHidden && window.Dropdowns) {
          window.Dropdowns.getAll()
            .filter(d => d.isOpen)
            .forEach(d => d.close({ cascade: true }));
        }
      }
      
      lastY = currentY;
      ticking = false;
    };

    const onScroll = () => {
      if (!ticking) {
        ticking = true;
        requestAnimationFrame(() => updateHeader(false));
      }
    };

    window.addEventListener('scroll', onScroll, { passive: true });
    
    // Initial state check - force visible on load regardless of position
    updateHeader(true);
  }
}

</script>
