<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Header (Menu Builder) — preview</title>
<link rel="stylesheet" href="assets/acss-sim.css">
<style>
:where(:root) {
  /* ===== MAIN TEMPLATE COLOURS — change colours here only =====
     Header, footer and every main-* section use these variables.
     By default they follow ACSS: changing Primary / Secondary in ACSS changes the templates too. */
  --main-primary: var(--primary, #1e3a5f);    /* brand: header, footer, FAQ, headings, links, tags */
  --main-accent: var(--secondary, #e8a33d);   /* highlight: underlines, hover, eyebrow line, active */
  --main-light: var(--white, #fff);           /* light backgrounds: sections, cards, article box */
  --main-text: var(--text-dark, #1a1a1a);     /* text on light backgrounds */
  --main-on-primary: var(--white, #fff);      /* text and icons on the primary colour */

  /* derived from the five colours above — no need to edit */
  --main-light-alt: color-mix(in srgb, var(--main-primary) 6%, var(--main-light));
  --main-text-muted: color-mix(in srgb, var(--main-text) 72%, transparent);
  --main-on-primary-muted: color-mix(in srgb, var(--main-on-primary) 78%, transparent);
  --main-line: color-mix(in srgb, var(--main-primary) 18%, transparent);
  --main-line-on-primary: color-mix(in srgb, var(--main-on-primary) 18%, transparent);
  --main-accent-soft: color-mix(in srgb, var(--main-accent) 20%, var(--main-light));
  --main-shadow: color-mix(in srgb, var(--main-text) 12%, transparent);
}

:where([data-etch-element="section"]) {
  inline-size: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
}

:where([data-etch-element="container"]) {
  inline-size: 100%;
  display: flex;
  flex-direction: column;
  max-inline-size: var(--content-width, 1366px);
  align-self: center; margin-inline: auto;
}

:where([data-etch-element="flex-div"]) {
  inline-size: 100%;
  display: flex;
  flex-direction: column;
}

.site-header {
  /* Colours come from the main colours (:where(:root)) — change them there */
  --header-bg: var(--main-primary);
  --header-text: var(--main-on-primary);
  --header-accent: var(--main-accent);
  --header-border: var(--main-line-on-primary);
  --header-panel-bg: var(--main-primary);
  --header-logo-height: 40px;
  --ease-swift: cubic-bezier(0.55, 0, 0.1, 1);

  pointer-events: none;
  z-index: 50;
  padding: 0;

  > * {
    pointer-events: auto;
  }

  @media (width <= 768px) {
    --header-logo-height: 32px;
  }

  /* ===== POSITION (data attributes on this element) ===== */
  &[data-overlay-header='true'],
  &[data-sticky-header='true'] {
    inset-block-start: var(--wp-admin--admin-bar--height, 0px);
  }

  &[data-overlay-header='true'] {
    position: absolute;
  }

  &[data-sticky-header='true'] {
    position: sticky;
  }

  &[data-sticky-header='true'][data-overlay-header='true'] {
    position: fixed;
  }

  &[data-overlay-header='true'][data-overlay-header-offset='true'] + main > :first-child > :first-child {
    margin-block-start: var(--header-height);
  }

  &[data-hide-on-scroll='true'] .site-header__bar {
    transition: transform 0.4s var(--ease-swift);
  }

  &.hide .site-header__bar {
    transform: translateY(-100%);
  }

  /* ===== HAMBURGER: only while the menu is in mobile mode ===== */
  #mobile-menu-toggle {
    display: none;
  }

  &:has(.menu-wrapper.mobile) :is(#mobile-menu-toggle, .toggle) {
    display: flex;
  }

  /* tablet: keep the buttons next to the hamburger */
  &:has(.menu-wrapper.mobile) .site-header__actions {
    margin-inline-start: auto;
  }

  .toggle {
    --toggle-icon-color: var(--header-text);
    color: var(--header-text);
  }

  /* ===== SKIP LINK (added by script) ===== */
  .skip-link {
    position: absolute;
    top: -1500px;
    left: 32px;
    z-index: 999;
    overflow: hidden;
    background: var(--main-light);
    color: var(--main-text);

    &:focus-visible {
      top: 32px;
    }
  }

  /* ===== MENU VARIABLES ===== */
  --link-color: var(--header-text);
  --link-color-hover: var(--header-text);
  --link-color-active: var(--header-accent);
  --link-bg-color: transparent;
  --link-bg-color-hover: transparent;
  --link-bg-color-active: transparent;
  --link-font-weight: var(--btn-font-weight);
  --link-transition: all 0.2s ease-out;
  --link-padding-inline: var(--btn-padding-inline, 1em);
  --link-padding-block: var(--btn-padding-block, 0.75em);
  --link-border-radius: var(--btn-border-radius);

  --dropdown-padding: calc(calc(5 * 1rem / var(--etch-root-px, 10)) + 3px) 0 calc(5 * 1rem / var(--etch-root-px, 10));
  --dropdown-border-radius: 0;
  --dropdown-border-width: 0px;
  --dropdown-border-color: transparent;
  --dropdown-bg: linear-gradient(var(--header-accent), var(--header-accent)) top / 100% 3px no-repeat, var(--header-panel-bg);
  --dropdown-box-shadow: 0 16px 36px var(--main-shadow);
  --dropdown-closed-top: 30px;
  --dropdown-open-top: 22px;

  --mobile-menu-padding-inline: var(--gutter);
  --mobile-menu-padding-block: var(--space-m);
  --mobile-menu-bg-color: var(--header-panel-bg);
  --mobile-menu-width: 768px;
  --mobile-dropdown-stacked-timing: cubic-bezier(0.86, 0.01, 0.09, 1.01);

  /* ===== DROPDOWN ANIMATION ===== */
  .menu-dropdown .menu-dropdown__content-wrapper {
    filter: blur(4px);
  }

  .menu-dropdown.is-open > .menu-dropdown__content-wrapper {
    filter: blur(0);
  }

  .menu-wrapper.desktop .menu-dropdown .menu-dropdown__content-wrapper,
  .menu-wrapper.desktop .morph-container {
    scale: 0.95;
  }

  .menu-wrapper.desktop .menu-dropdown.is-open > .menu-dropdown__content-wrapper,
  .menu-wrapper.desktop .morph-container.is-active {
    scale: 1;
  }

  .menu-dropdown-back-button {
    font-weight: var(--link-font-weight);
    padding-block: 1em;
    padding-inline: var(--mobile-menu-padding-inline);
    color: var(--link-color);
    background-color: var(--mobile-menu-bg-color);
    border-block-end: 1px solid var(--header-border);
  }

  /* show desktop menu before the menu script initialises */
  .menu-wrapper.desktop:not([data-menu-initialized]) {
    @media (width >= 1200px) {
      opacity: 1;
    }
  }

  /* ===== DESKTOP MENU (centred between logo and buttons) ===== */
  .menu-wrapper.desktop {
    flex: 1 1 auto;

    .site-header__nav-list {
      justify-content: center;
    }

    .site-header__nav-list > li {
      inline-size: fit-content;
      white-space: nowrap;
    }

    .site-header__nav-list > li > *:is(a, button) {
      position: relative;
      padding-inline: var(--link-padding-inline);
      padding-block: var(--link-padding-block);
      border-radius: var(--link-border-radius);
      font-size: var(--text-s);
      line-height: 100%;
      color: var(--link-color);
      text-decoration: none;
      transition: var(--link-transition);

      /* animated underline */
      &::after {
        content: '';
        position: absolute;
        left: var(--link-padding-inline, 1em);
        right: var(--link-padding-inline, 1em);
        bottom: 0.35em;
        height: 2px;
        background-color: var(--header-accent);
        transform: scaleX(0);
        transform-origin: left;
        transition: transform 0.25s ease;
      }

      &:hover::after,
      &[aria-expanded='true']::after {
        transform: scaleX(1);
      }

      &.active-link {
        color: var(--link-color-active);
      }
    }

    .menu-dropdown__content {
      min-inline-size: 220px;
      gap: 0;
    }

    .menu-dropdown__content > li:not(:last-child) > a {
      box-shadow: inset 0 -1px 0 var(--header-border);
    }

    .menu-dropdown__content > li > a {
      display: block;
      padding: 0.6em 1.25em;
      font-size: var(--text-s);
      font-weight: 400;
      line-height: 1.3;
      color: var(--header-text);
      text-decoration: none;
      white-space: nowrap;
      transition: background-color 0.15s ease;

      &:hover,
      &:focus-visible {
        background-color: var(--header-accent);
        color: var(--header-text);
      }

      &:focus-visible {
        outline: 2px solid var(--header-text);
        outline-offset: -2px;
      }

      &[href='#'] {
        cursor: default;
      }
    }
  }

  /* ===== MOBILE MENU ===== */
  .menu-wrapper.mobile {
    .menu-wrapper__inner {
      display: flex;
      flex-direction: column;
      border-block-start: 3px solid var(--header-accent);
      color: var(--header-text);
    }

    .site-header__nav {
      flex: 1;
      position: relative;
      padding-inline: var(--mobile-menu-padding-inline);
      overflow-y: auto;
      overflow-x: clip;
    }

    .site-header__nav-list {
      flex-direction: column;
      justify-content: flex-start;
      flex-grow: 1;
      block-size: 100%;

      > li {
        inline-size: 100%;
        max-inline-size: 100%;
        border-block-end: 1px solid var(--header-border);

        > a,
        .menu-dropdown,
        .menu-dropdown__trigger {
          inline-size: 100%;
        }
      }
    }

    .site-header__nav-list > li > *:is(a, button),
    .menu-dropdown__content > li > *:is(a, button) {
      padding-block: var(--btn-padding-block);
      padding-inline: 0;
      line-height: 100%;
      color: var(--header-text);
      text-decoration: none;
      background-color: transparent;
      transition: var(--link-transition);

      &:hover,
      &[aria-expanded='true'] {
        color: var(--header-accent);
      }
    }

    .menu-dropdown__trigger {
      inline-size: 100%;
      justify-content: space-between;
    }

    .menu-dropdown__content-wrapper {
      background-color: transparent;
    }

    .menu-dropdown__content a {
      opacity: 0.8;
    }

    :where(& .menu-dropdown__content-wrapper.stacked-mode .menu-dropdown__content) {
      padding-block: var(--mobile-menu-padding-block);
      padding-inline: var(--mobile-menu-padding-inline);
    }

    :where(& .menu-dropdown.accordion-mode .menu-dropdown__content) {
      padding-inline: var(--space-xs);
    }

    :where(& .menu-dropdown.accordion-mode[data-mega-menu='true'] .menu-dropdown__content) {
      padding-block: var(--space-xs);
    }
  }
}

.site-header__bar {
  inline-size: 100%;
  padding: var(--space-xs) var(--gutter);
  background-color: var(--header-bg);
  border-block-end: 1px solid var(--header-border);
}

.site-header__container {
  flex-direction: row;
  justify-content: space-between;
  align-items: center;
  gap: var(--space-m);
}

.site-header__logo {
  display: flex;
  flex-shrink: 0;
}

.site-header__logo-img {
  block-size: var(--header-logo-height);
  inline-size: auto;
  max-inline-size: 100%;
  object-fit: contain;
}

.site-header__actions {
  display: flex;
  align-items: center;
  gap: var(--space-xs);
  flex-shrink: 0;

  @media (width <= 768px) {
    display: none;
  }

  /* phone button — no own style record so its ACSS btn classes survive the paste */
  .site-header__phone {
    display: inline-flex;
    align-items: center;
    gap: var(--space-xs);
    white-space: nowrap;

    svg {
      inline-size: 1em;
      block-size: 1em;
      flex: 0 0 auto;
    }
  }
}

.mobile-menu-header {
  flex-direction: column;
  justify-content: center;
  padding-inline: var(--mobile-menu-padding-inline);
  min-block-size: var(--header-height);
  display: none;

  /* display only off canvas */
  .menu-wrapper.off-canvas-mode &{
    display: flex;
  }
}

.hide-from-desktop-menu {
  
}

.site-header__nav {
  
}

.site-header__nav-list {
  display: flex;
  flex-direction: row;
  align-items: center;
  gap: var(--space-xs);
  margin: 0;
  padding: 0;
  list-style: none;

  li {
    max-inline-size: 100%;
  }
}

#menu-wrapper {
  
}

.menu-wrapper:where(.site-header *) {
  gap: 0;
  inline-size: fit-content;

  /* - on mobile off canvas mode */
  &.mobile.off-canvas-mode {
    position: fixed;
    inset: 0;
    visibility: hidden;
    inline-size: 100%;
    pointer-events: none;
    z-index: 999;
    opacity: 1;
    transition: visibility var(--mobile-menu-transition-duration, 0.2s) ease-out;
  }

  /* - on mobile reveal mode */
  &.mobile.reveal-mode {
    inline-size: 100%;
    position: absolute;
    inset-block-start: 100%;
    inset-inline: 0;
    overflow: hidden;
    visibility: hidden;
    clip-path: polygon(0 0, 100% 0, 100% 0, 0 0);
    background-color: var(--mobile-menu-bg-color);
    transition: clip-path, visibility, transform, opacity;
    transition-duration: var(--mobile-menu-transition-duration, 0.2s);
    transition-timing-function: cubic-bezier(0.42, 0, 0.58, 1);

    .menu-wrapper__inner {
      overflow-y: auto;
      overflow-x: clip;
      transform: translateY(20px);
    }

    .site-header__nav {
      padding-block-end: var(--mobile-menu-padding-block);
    }
  }

  /* - on mobile AND on open */
  &.mobile.open {
    visibility: visible;
    opacity: 1;
  }

  /* - on mobile AND open AND reveal mode */
  &.mobile.reveal-mode.open {
    clip-path: polygon(0 0, 100% 0, 100% 100%, 0 100%);

    .menu-wrapper__inner {
      transform: translateY(0);
    }
  }

  /* HELPER CLASSES */

  /* - hide item on desktop */
  &.desktop :is(.hide-from-desktop-menu, [data-menu-hide='desktop']) {
    display: none;
  }

  /* - hide item on mobile */
  &.mobile :is(.hide-from-mobile-menu, [data-menu-hide='mobile']) {
    display: none;
  }

  /* hide menu until initialized */

  &:not([data-menu-initialized]) {
    opacity: 0;
  }

  /* MORPH MODE (desktop shared morphing container, JS-created) */
  .morph-container {
    position: absolute;
    inset-block-start: 100%;
    inset-inline-start: 0;
    z-index: 999;
    background: var(--dropdown-bg, white);
    box-shadow: var(--dropdown-box-shadow);
    border-radius: var(--dropdown-border-radius);
    border: var(--dropdown-border-width) solid var(--dropdown-border-color);
    visibility: hidden;
    opacity: 0;
    transform: translateY(var(--dropdown-closed-top, 40px));
    transition-property: opacity, transform, visibility, scale;
    transition-duration: var(--dropdown-transition-duration, 0.15s);
    transition-timing-function: var(--dropdown-transition-timing, cubic-bezier(0.4, 0, 0.2, 1));
    transition-delay: var(--dropdown-transition-delay, 0s);

    /* open / close */
    &.is-active {
      visibility: visible;
      opacity: 1;
      transform: translateY(var(--dropdown-open-top, 20px));
    }

    /* JS adds is-morphing while sliding between panels: the container box
       itself animates position and size, and clips the panel slide */
    &.is-morphing {
      overflow: clip;
      transition-property: opacity, transform, visibility, inset-inline-start, inline-size, block-size;
      transition-duration: var(--dropdown-transition-duration, 0.3s);
      transition-timing-function: var(--dropdown-transition-timing, cubic-bezier(0.4, 0, 0.2, 1));
    }

    /* panels: shown via is-active (the .is-open parent selector no longer
       applies once JS moves them into the shared container) */
    .menu-dropdown__content-wrapper.morph-panel {
      transition-property: opacity, visibility;

      &.is-active {
        visibility: visible;
        opacity: 1;
      }

      /* the shared container carries the dropdown chrome instead */
      > .menu-dropdown__content {
        background: transparent;
        box-shadow: none;
        border: none;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      transition: none;
    }
  }
}

.menu-wrapper__inner:where(.site-header *) {
  pointer-events: auto;
  min-block-size: 0px;
  transition-property: visibility, opacity, transform;
      transition-duration: var(--mobile-menu-transition-duration, 0.2s);
      transition-timing-function: cubic-bezier(0.42, 0, 0.58, 1);

  .menu-wrapper.off-canvas-mode.mobile & {
    position: absolute;
    inset-block-end: 0;
    z-index: 999;
    opacity: 0;
    visibility: hidden;
    background: var(--mobile-menu-bg-color);
    max-inline-size: var(--mobile-menu-width, 500px);
    inline-size: 100%;
    overflow: hidden;
    block-size: 100%;
    inset-block-start: var(--wp-admin--admin-bar--height, 0px);
  }

  .menu-wrapper.off-canvas-mode.mobile.open & {
    opacity: 1;
    visibility: visible;
    transform: translate(0, 0) !important;
  }

  .menu-wrapper.off-canvas-mode.mobile[data-mobile-off-canvas-direction='from right' i] & {
    transform: translateX(100%);
    inset-inline-end: 0;

    html[dir='RTL'] & {
      inset-inline-start: 0;
      inset-inline-end: unset;
    }
  }

  .menu-wrapper.off-canvas-mode.mobile[data-mobile-off-canvas-direction='from left' i] & {
    transform: translateX(-100%);
    will-change: inset-inline;
    inset-inline-start: 0;

    html[dir='RTL'] & {
      inset-inline-end: 0;
      inset-inline-start: unset;
    }
  }

  .menu-wrapper.off-canvas-mode.mobile[data-mobile-off-canvas-direction='from top' i] & {
    transform: translateY(-100%);
    --mobile-menu-width: 100%;
  }

  .menu-wrapper.off-canvas-mode.mobile[data-mobile-off-canvas-direction='from bottom' i] & {
    transform: translateY(100%);
    --mobile-menu-width: 100%;
  }

  .menu-wrapper:not(.off-canvas-mode).mobile & {
    max-block-size: 70vh;
  }
}

.menu-wrapper-backdrop:where(.site-header *) {
  position: fixed;
  inset: 0;
  z-index: 998;
  background-color: var(--mobile-menu-backdrop-color);
  opacity: 0%;
  visibility: hidden;
  transition-property: opacity, visibility;
  transition-duration: var(--mobile-menu-transition-duration);
  transition-delay: calc(var(--mobile-menu-transition-duration) / 1.5);
  transition-timing-function: ease-out;
  pointer-events: none;

  .menu-wrapper.open & {
    visibility: visible;
    opacity: var(--mobile-menu-backdrop-opacity);
  }
}

.menu-link:where(.site-header *) {
  display: flex;
  align-items: center;
}

.menu-dropdown:where(.site-header *) {
  /* on open */
  &.is-open > .menu-dropdown__content-wrapper {
    visibility: visible;
    opacity: 1;
  }

  .menu-dropdown .menu-dropdown__trigger {
    inline-size: 100%;
    justify-content: space-between;
    text-align: start;
  }

  /* DROPDOWN MODE */
  &.dropdown-mode {
    position: relative;

    .menu-dropdown__content-wrapper {
      transform: translateY(var(--dropdown-closed-top, 40px));
      height: fit-content;
    }

    .menu-dropdown__content {
      padding: var(--dropdown-padding);
      block-size: fit-content;
      background: var(--dropdown-bg, white);
      box-shadow: var(--dropdown-box-shadow);
      border-radius: var(--dropdown-border-radius);
      border-width: var(--dropdown-border-width);
      border-color: var(--dropdown-border-color);
      border-style: solid;
    }

    /* - nested dropdowns */
    .menu-dropdown {
      /* -- Nested trigger styling */
      .menu-dropdown__trigger {
        inline-size: 100%;
        justify-content: space-between;
        text-align: start;

        /* --- Rotate arrow 90° for nested (pointing right) */
        .menu-dropdown__trigger-icon {
          transform: rotate(-90deg);

          html[dir='rtl'] & {
            transform: rotate(90deg);
          }
        }

        &.active .menu-dropdown__trigger-icon {
          transform: rotate(0deg); /* Back to pointing down when open */
        }
      }

      > .menu-dropdown__content-wrapper {
        position: absolute;
        inset-inline-start: calc(100% + var(--dropdown-padding));
      }
    }

    .menu-dropdown__content-wrapper {
      inset-block-end: 0;
    }

    /* - dropdown positioning */
    .menu-dropdown__content-wrapper.position-left {
      inset-inline-start: auto;
      inset-inline-end: 100%;
      margin-inline-start: 0;
      margin-inline-end: var(--dropdown-padding);

      &.position-bottom {
        transform-origin: top right;

        html[dir='rtl'] & {
          transform-origin: top left;
        }
      }

      &.position-top {
        transform-origin: bottom right;

        html[dir='rtl'] & {
          transform-origin: bottom left;
        }
      }
    }

    .menu-dropdown__content-wrapper.position-right {
      &.position-bottom {
        transform-origin: top left;

        html[dir='rtl'] & {
          transform-origin: top right;
        }
      }

      &.position-top {
        transform-origin: bottom left;

        html[dir='rtl'] & {
          transform-origin: bottom right;
        }
      }
    }

    .menu-dropdown__content-wrapper.position-top {
      inset-block-start: auto;
      inset-block-end: calc(100% + var(--dropdown-padding));
    }

    /* - transforming open */
    &.is-open > .menu-dropdown__content-wrapper {
      transform: translateY(var(--dropdown-open-top, 20px));
    }

    .menu-dropdown > .menu-dropdown__content-wrapper {
      transform: translateY(calc((var(--dropdown-padding) + var(--dropdown-border-width)) * -1));

      &.position-top {
        transform: translateY(calc(var(--dropdown-padding) + var(--dropdown-border-width)));
      }
    }
  }

  /* ACCORDION MODE */
  &.accordion-mode {
    inline-size: 100%;

    .menu-dropdown {
      flex-direction: column;
    }

    .menu-dropdown__content-wrapper {
      position: static;
    }
  }

  /* STACKED MODE */
  &.stacked-mode {
    .menu-dropdown__trigger-icon-wrapper {
      transform: rotate(-90deg);

      html[dir='rtl'] & {
        transform: rotate(90deg);
      }
    }
  }

  /* specifically not stacked mode flip trigger icon */
  &:not(.stacked-mode) .menu-dropdown__trigger.active .menu-dropdown__trigger-icon {
    transform: scaley(-1);
  }
}

.menu-dropdown__trigger:where(.site-header *) {
  display: flex;
  flex-direction: row;
  align-items: center;
  inline-size: fit-content;
  gap: var(--dropdown-trigger-gap, 0.5em);
}

.menu-dropdown__trigger-label:where(.site-header *) {
  white-space: nowrap;
}

.menu-dropdown__trigger-icon-wrapper:where(.site-header *) {
  inline-size: fit-content;
}

.menu-dropdown__trigger-icon:where(.site-header *) {
  block-size: var(--dropdown-trigger-icon-size, 1em);
  inline-size: var(--dropdown-trigger-icon-size, 1em);
  min-inline-size: var(--dropdown-trigger-icon-size, 1em);
  transition: transform var(--dropdown-transition-duration, 0.15s) ease-out;
  color: inherit;

  path {
    stroke: currentColor
  }
}

<script type="module">
// Select the header element
const header = document.querySelector('.site-header');

// Early exit if header doesn't exist on this page
if (!header) {
  if (window.console) console.warn('Header element (.site-header) not found.');
} else {
  // 1. CONFIGURATION
  // Read once and cache to avoid repeated DOM access
  const ds = header.dataset;
  const config = {
    sticky: ds.stickyHeader === 'true',
    hide: ds.hideOnScroll === 'true',
    up: ds.showOnScrollUp === 'true',
    at: parseInt(ds.hideAt, 10) || 0,
    skipLink: ds.skipLink === 'true'
  };

  // 2. SKIP LINK
  // Add accessible skip link for keyboard navigation
  if (config.skipLink && !header.querySelector('.skip-link')) {
    const skipLink = document.createElement('a');
    skipLink.href = '#main';
    skipLink.className = 'skip-link';
    skipLink.textContent = 'Skip to main content';
    header.insertBefore(skipLink, header.firstChild);

    // Set id on main element
    const main = document.querySelector('main');
    if (main) {
      main.id = 'main';
    }
  }

  // 3. HEADER HEIGHT
  // Using ResizeObserver handles initial load, window resize, and content changes
  // It's more performant and robust than manual event listeners + debounce
  const updateHeight = () => document.documentElement.style.setProperty('--header-height', `${header.offsetHeight}px`);
  
  if (window.ResizeObserver) {
    new ResizeObserver(updateHeight).observe(header);
  } else {
    window.addEventListener('resize', updateHeight);
    window.addEventListener('load', updateHeight);
    updateHeight();
  }

  // 4. SCROLL LOGIC (Merged into single rAF loop)
  // Consolidating all scroll updates into one requestAnimationFrame callback
  // minimizes layout thrashing and synchronizes DOM updates with screen refreshes.
  if (config.sticky) {
    let lastY = window.scrollY;
    let ticking = false;
    let isHidden = false;
    const tolerance = 5; // Ignore tiny scroll movements

    const updateHeader = (forceVisible = false) => {
      const currentY = Math.max(0, window.scrollY); // Normalize for mobile bounce
      
      // Toggle 'scrolling' class based on any scroll from top
      header.classList.toggle('scrolling', currentY > 0);

      // Hide-on-scroll logic
      if (config.hide && config.at > 0) {
        const isMenuOpen = document.body.classList.contains('menu-open');
        const pastThreshold = currentY >= config.at;

        if (isMenuOpen || forceVisible) {
          isHidden = false;
        } else if (config.up) {
          // Mode: responsive to scroll direction past threshold
          if (!pastThreshold) {
            isHidden = false;
          } else {
            const diff = currentY - lastY;
            if (diff > tolerance) {
              isHidden = true; // Hiding because user is scrolling DOWN
            } else if (diff < -tolerance) {
              isHidden = false; // Showing because user is scrolling UP
            }
          }
        } else {
          // Mode: static threshold
          // If initial load, we don't hide immediately even if past threshold
          isHidden = pastThreshold;
        }

        header.classList.toggle('hide', isHidden);

        // Close all open dropdowns when header hides
        if (isHidden && window.Dropdowns) {
          window.Dropdowns.getAll()
            .filter(d => d.isOpen)
            .forEach(d => d.close({ cascade: true }));
        }
      }
      
      lastY = currentY;
      ticking = false;
    };

    const onScroll = () => {
      if (!ticking) {
        ticking = true;
        requestAnimationFrame(() => updateHeader(false));
      }
    };

    window.addEventListener('scroll', onScroll, { passive: true });
    
    // Initial state check - force visible on load regardless of position
    updateHeader(true);
  }
}

</script>
<script type="module">
// ============================================
// menuWrapper COMPONENT - SINGLE BREAKPOINT CONTROLLER
// ============================================

const menuWrapper = document.querySelector('[data-menu-element="menu-wrapper"]');

if (!menuWrapper) {
  if (window.console) console.warn("⚠️ No menu wrapper element found.");
} else {
  // 1. CONFIGURATION & STATE
  const ds = menuWrapper.dataset;
  const mobileMenuMode = ds.mobileMenuMode || "Off Canvas";
  const breakpoint = ds.mobileBreakpoint || "768px";
  const mediaQuery = window.matchMedia(`(max-width: ${breakpoint})`);
  
  // Store original location for desktop restoration
  const originalParent = menuWrapper.parentElement;
  const originalNextSibling = menuWrapper.nextSibling;
  const headerInner = document.querySelector('[data-menu-element="header-inner"]');
  if (!headerInner && window.console) {
    console.warn('⚠️ [Menu Wrapper] No header inner element found targeting [data-menu-element="header-inner"]. Mobile positioning may fail.');
  }

  // 2. TOGGLE LOGIC
  // Sync body class with menu state
  menuWrapper.addEventListener("toggle:change", (e) => {
    document.body.classList.toggle("menu-open", !!e.detail.isEnabled);
  });

  // 3. DOM MANIPULATION
  const moveToMobileLocation = () => {
    if (!headerInner) {
      console.warn("⚠️ No header-inner found to move menuWrapper relative to.");
      return;
    }
    // Efficiently move if not already there
    if (headerInner.nextSibling !== menuWrapper) {
      headerInner.parentNode.insertBefore(menuWrapper, headerInner.nextSibling);
    }
  };

  const restoreToDesktopLocation = () => {
    if (!originalParent) return;
    // Efficiently move back using the sibling reference
    if (menuWrapper.nextSibling !== originalNextSibling || menuWrapper.parentNode !== originalParent) {
      originalParent.insertBefore(menuWrapper, originalNextSibling);
    }
  };

  // 4. BREAKPOINT HANDLER
  const handleBreakpointChange = (e) => {
    const isMobile = e.matches;
    
    // Toggle primary state classes
    menuWrapper.classList.toggle("mobile", isMobile);
    menuWrapper.classList.toggle("desktop", !isMobile);

    if (isMobile) {
      const isOffCanvas = mobileMenuMode === "Off Canvas";
      const isReveal = mobileMenuMode === "Reveal";
      
      menuWrapper.classList.toggle("off-canvas-mode", isOffCanvas);
      menuWrapper.classList.toggle("reveal-mode", isReveal);

      if (isOffCanvas) moveToMobileLocation();
      
      if (isOffCanvas) {
        menuWrapper.setAttribute("role", "dialog");
        menuWrapper.setAttribute("aria-modal", "true");
      } else {
        menuWrapper.removeAttribute("role");
        menuWrapper.removeAttribute("aria-modal");
      }
      
      menuWrapper.dispatchEvent(new CustomEvent("menuWrapper:mobile"));
    } else {
      // Desktop: close menu if any toggle targeting this wrapper is on
      const wrapperId = menuWrapper.id;
      if (wrapperId && typeof window.Toggles !== "undefined") {
        const togglesForThisMenu = window.Toggles.findByTarget(wrapperId) || [];
        togglesForThisMenu.forEach((t) => {
          if (t.isEnabled) t.disable();
        });
      }
      // Desktop Cleanup
      menuWrapper.classList.remove("off-canvas-mode", "reveal-mode");
      menuWrapper.removeAttribute("role");
      menuWrapper.removeAttribute("aria-modal");
      restoreToDesktopLocation();
      menuWrapper.dispatchEvent(new CustomEvent("menuWrapper:desktop"));
    }
  };

  // 5. ACTIVE LINK DETECTION
  // Marks navigation links matching the current URL with an "active" class
  const nav = menuWrapper.querySelector('nav');
  
  const setActiveLink = () => {
    if (!nav) return;
    
    const currentUrl = new URL(window.location.href);
    let currentPath = currentUrl.pathname;
    
    // Normalize: strip trailing slash except for root
    if (currentPath.length > 1 && currentPath.endsWith('/')) {
      currentPath = currentPath.slice(0, -1);
    }
    
    // Query links only within the nav element
    const links = nav.querySelectorAll('a[href]');
    
    links.forEach(link => {
      const href = link.getAttribute('href');
      
      // Skip non-navigable links
      if (!href || href === '#' || href.startsWith('javascript:') || href.startsWith('mailto:') || href.startsWith('tel:')) {
        return;
      }
      
      try {
        // Resolve link href relative to the current origin
        const linkUrl = new URL(href, window.location.origin);
        
        // Only process links within the same origin
        if (linkUrl.origin !== currentUrl.origin) return;
        
        let linkPath = linkUrl.pathname;
        
        // Apply same normalization as currentPath
        if (linkPath.length > 1 && linkPath.endsWith('/')) {
          linkPath = linkPath.slice(0, -1);
        }
        
        // Match and apply active class
        if (linkPath === currentPath) {
          link.classList.add('active-link');
        } else {
          link.classList.remove('active-link');
        }
      } catch (e) {
        // Silently skip malformed URLs
        return;
      }
    });
  };

  // 6. INITIALIZE (Run immediately to prevent FOUC)
  handleBreakpointChange(mediaQuery);
  setActiveLink(); // Set initial active state
  menuWrapper.setAttribute("data-menu-initialized", "true");
  mediaQuery.addEventListener("change", handleBreakpointChange);
}

</script>

// and supports optional toggle labels (alternate mode) with
// accessible ARIA-friendly width handling.

//
// Adds a global API:

//     findByTarget(targetId: string): ToggleInstance[],

     * Uses a counter to handle multiple overlapping scroll-frozen elements.

        if (freeze) {
            scrollFreezeCount++;

            scrollFreezeCount = Math.max(0, scrollFreezeCount - 1);

            document.body.classList.add("scroll-locked");
            document.body.style.overflow = "hidden";

            if (!labelWrapper) return;

            const labelOn = labelWrapper.querySelector(".label-on");
            const labelOff = labelWrapper.querySelector(".label-off");

        on(eventName, handler) {

    // INITIALIZATION & GLOBAL API
    // --------------------------------------------
    const toggleButtons = document.querySelectorAll("button.toggle");
    if (toggleButtons.length === 0) {

    }

    toggleButtons.forEach(btn => new Toggle(btn));

    // Recalculate label widths on resize
    let resizeRafId = null;
    window.addEventListener("resize", () => {

      this.trigger.setAttribute("aria-haspopup", "true");
    } else {
      this.trigger.removeAttribute("aria-haspopup");
    }

    if (newMode === "dropdown" || newMode === "morph") {
      const activation = this.resolveActivationMode();
      this.config.activationMode = activation;
      this.config.activateOnHover = activation === "hover and click";

      this.attachDropdownEvents();
      if (newMode === "morph") {
        this.setupMorphMode();
      } else if (this.config.widthMatch && this.level === 0) {
        this.updatePosition();
      }
    } else if (newMode === "accordion") {
      this.trigger.addEventListener("click", this.handleTriggerClick);
      this.contentWrapper.style.overflow = "hidden";
      this.contentWrapper.style.maxHeight = "0px";
      this.contentWrapper.addEventListener("transitionend", this.handleTransitionEnd);
    } else if (newMode === "stacked") {
      this.trigger.addEventListener("click", this.handleTriggerClick);
      this.setupStackedMode();
    }

    this.dispatchDropdownEvent("modeChange", { oldMode, newMode });
  }

  cleanupCurrentMode() {
    this.detachEvents();
    if (this.mode === "morph") this.teardownMorphMode();
    if (this.mode === "stacked") this.teardownStackedMode();
    if (this.mode === "accordion") {
      this.contentWrapper.style.overflow = "";
      this.contentWrapper.style.maxHeight = "";
      this.contentWrapper.removeEventListener("transitionend", this.handleTransitionEnd);
    }
    
    this.contentWrapper.style.inlineSize = "";
    this.contentWrapper.style.insetInlineStart = "";
    this.contentWrapper.style.maxInlineSize = "";
  }

  attachDropdownEvents() {
    if (this.config.activateOnHover) {
      HOVER_AIM.start();
      this.trigger.addEventListener("click", this.handleHoverModeClick);
      this.trigger.addEventListener("mouseenter", this.handleTriggerMouseEnter);
      this.trigger.addEventListener("mouseleave", this.handleTriggerMouseLeave);
      this.contentWrapper.addEventListener("mouseenter", this.handleContentMouseEnter);
      this.contentWrapper.addEventListener("mouseleave", this.handleContentMouseLeave);
    } else {
      this.trigger.addEventListener("click", this.handleTriggerClick);
    }
    this.dropdown.addEventListener("focusout", this.handleFocusOut);
  }

  detachEvents() {
    this.trigger.removeEventListener("click", this.handleTriggerClick);
    this.trigger.removeEventListener("click", this.handleHoverModeClick);
    this.trigger.removeEventListener("mouseenter", this.handleTriggerMouseEnter);
    this.trigger.removeEventListener("mouseleave", this.handleTriggerMouseLeave);
    this.contentWrapper.removeEventListener("mouseenter", this.handleContentMouseEnter);
    this.contentWrapper.removeEventListener("mouseleave", this.handleContentMouseLeave);
    this.dropdown.removeEventListener("focusout", this.handleFocusOut);
    clearTimeout(this.hoverTimeout);
    clearTimeout(this._aimTimer);
  }

  setupStackedMode() {
    if (navRoot && this.contentWrapper.parentElement !== navRoot) {
      navRoot.appendChild(this.contentWrapper);
    }
    this.contentWrapper.classList.add("stacked-mode");
    this.trigger.addEventListener("keydown", this.handleStackedKeydown);
    this.contentWrapper.addEventListener("focusin", this.handleStackedFocusIn);
    this.contentWrapper.addEventListener("focusout", this.handleStackedFocusOut);
  }

  teardownStackedMode() {
    this.contentWrapper.classList.remove("stacked-mode", "open");
    this.trigger.removeEventListener("keydown", this.handleStackedKeydown);
    this.contentWrapper.removeEventListener("focusin", this.handleStackedFocusIn);
    this.contentWrapper.removeEventListener("focusout", this.handleStackedFocusOut);
    this.restoreContentWrapper();
  }

  restoreContentWrapper() {
    if (this.originalParent && this.originalParent !== this.contentWrapper.parentElement) {
      if (this.originalNextSibling && this.originalNextSibling.parentElement === this.originalParent) {
        this.originalParent.insertBefore(this.contentWrapper, this.originalNextSibling);
      } else {
        this.originalParent.appendChild(this.contentWrapper);
      }
    }
  }

  // --- Morph Mode (shared morphing container) ---

  setupMorphMode() {
    const container = morphShared.retain();
    if (!container) return;

    if (this.contentWrapper.parentElement !== container) container.appendChild(this.contentWrapper);
    // menu-dropdown + dropdown-mode keep the nested-dropdown CSS working outside the .menu-dropdown root.
    this.contentWrapper.classList.add("morph-panel", "menu-dropdown", "dropdown-mode");

    const s = this.contentWrapper.style;
    s.position = "absolute";
    s.insetBlockStart = "0";
    s.insetBlockEnd = "auto";
    s.insetInlineStart = "0";
    s.insetInlineEnd = "auto";
    s.inlineSize = "max-content";
    
    s.transform = "none";

    this.trigger.addEventListener("keydown", this.handleMorphTriggerKeydown);
    this.contentWrapper.addEventListener("keydown", this.handleMorphPanelKeydown);
    // the panel lives outside this.dropdown, so it needs its own focusout watcher
    this.contentWrapper.addEventListener("focusout", this.handleFocusOut);
  }

  teardownMorphMode() {
    if (this._panelAnim) this._panelAnim.cancel();
    this._panelAnim = null;
    this._morphTakeover = false;
    if (this.isOpen) morphShared.hide();

    this.trigger.removeEventListener("keydown", this.handleMorphTriggerKeydown);
    this.contentWrapper.removeEventListener("keydown", this.handleMorphPanelKeydown);
    this.contentWrapper.removeEventListener("focusout", this.handleFocusOut);

    this.contentWrapper.classList.remove("morph-panel", "menu-dropdown", "dropdown-mode", "is-active");
    const s = this.contentWrapper.style;
    s.position = "";
    s.insetBlockStart = "";
    s.insetBlockEnd = "";
    s.insetInlineEnd = "";
    s.transform = "";
    // inlineSize / insetInlineStart / maxInlineSize are cleared by cleanupCurrentMode

    this.restoreContentWrapper();
    morphShared.release();
  }

  getOpenMorphSibling() {
    return allDropdownInstances.find((other) => other !== this && other.mode === "morph" && other.isOpen) || null;
  }

  computeMorphGeometry() {
    const navRect = navRoot.getBoundingClientRect();
    const isRTL = getIsRTL();
    const target = this.config.widthMatch ? document.querySelector(this.config.widthMatch) : null;
    let anchorRect;
    if (target) {
      const targetRect = target.getBoundingClientRect();
      this.contentWrapper.style.inlineSize = `${targetRect.width}px`;
      anchorRect = targetRect;
    } else {
      this.contentWrapper.style.inlineSize = "max-content";
      anchorRect = this.trigger.getBoundingClientRect();
    }

    const width = this.contentWrapper.offsetWidth;
    const height = this.contentWrapper.offsetHeight;

    const inlineStart = isRTL ? navRect.right - anchorRect.right : anchorRect.left - navRect.left;

    return { inlineStart, width, height };
  }

  // Match JS timing to the CSS --dropdown-transition-duration instead of a fixed value.
  getMorphDuration() {
    const raw = getComputedStyle(this.dropdown).getPropertyValue("--dropdown-transition-duration").trim();
    return parseCssTime(raw, 300);
  }

  openMorphPanel(morphSource) {
    const container = morphShared.container;
    if (!container) return;

    const geometry = this.computeMorphGeometry();
    const cs = container.style;

    if (morphSource && !prefersReducedMotion() && container.classList.contains("is-active")) {
      const duration = this.getMorphDuration();
      // direction of travel between the two triggers (physical axis)
      const direction = this.trigger.getBoundingClientRect().left >= morphSource.trigger.getBoundingClientRect().left ? 1 : -1;
      container.classList.add("is-morphing");
      cs.insetInlineStart = `${geometry.inlineStart}px`;
      cs.inlineSize = `${geometry.width}px`;
      cs.blockSize = `${geometry.height}px`;
      morphSource.hideMorphPanel(direction, duration);
      this.showMorphPanel(direction, duration);
      clearTimeout(morphShared.morphTimer);
      // hold is-morphing until the CSS transition finishes (+ small buffer)
      morphShared.morphTimer = setTimeout(() => container.classList.remove("is-morphing"), duration + 100);
    } else {
      container.classList.remove("is-morphing");
      if (morphSource) morphSource.hideMorphPanel(0);
      cs.insetInlineStart = `${geometry.inlineStart}px`;
      cs.inlineSize = `${geometry.width}px`;
      cs.blockSize = `${geometry.height}px`;
      if (!container.classList.contains("is-active")) {
        container.offsetWidth; // commit geometry before the entrance transition
        container.classList.add("is-active");
      }
      this.showMorphPanel(0);
    }
  }

  refreshMorphGeometry() {
    const container = morphShared.container;
    if (!container || !this.isOpen) return;
    container.classList.remove("is-morphing");
    const geometry = this.computeMorphGeometry();
    container.style.insetInlineStart = `${geometry.inlineStart}px`;
    container.style.inlineSize = `${geometry.width}px`;
    container.style.blockSize = `${geometry.height}px`;
  }

  showMorphPanel(direction, duration = 300) {
    if (this._panelAnim) this._panelAnim.cancel();
    this._panelAnim = null;
    this.contentWrapper.classList.add("is-active");
    if (direction && this.contentWrapper.animate) {
      this._panelAnim = this.contentWrapper.animate(
        [
          { transform: `translateX(${direction * 40}px)`, opacity: 0 },
          { transform: "translateX(0px)", opacity: 1 },
        ],
        { duration, easing: "cubic-bezier(0.4, 0, 0.2, 1)" }
      );
    }
  }

  hideMorphPanel(direction, duration = 300) {
    if (this._panelAnim) this._panelAnim.cancel();
    this._panelAnim = null;
    if (direction && this.contentWrapper.animate) {
      const anim = this.contentWrapper.animate(
        [
          { transform: "translateX(0px)", opacity: 1 },
          { transform: `translateX(${direction * -40}px)`, opacity: 0 },
        ],
        { duration, easing: "cubic-bezier(0.4, 0, 0.2, 1)", fill: "both" }
      );
      this._panelAnim = anim;
      anim.onfinish = () => {
        this.contentWrapper.classList.remove("is-active");
        anim.cancel();
        if (this._panelAnim === anim) this._panelAnim = null;
      };
    } else {
      this.contentWrapper.classList.remove("is-active");
    }
  }

  handleMorphTriggerKeydown(e) {
    if (this.mode !== "morph" || !this.isOpen || e.key !== "Tab" || e.shiftKey) return;
    const tabbables = getTabbableElements(this.contentWrapper);
    if (tabbables.length) {
      e.preventDefault();
      tabbables[0].focus();
    }
  }

  handleMorphPanelKeydown(e) {
    if (this.mode !== "morph" || e.key !== "Tab") return;
    const tabbables = getTabbableElements(this.contentWrapper);
    if (!tabbables.length) return;
    if (e.shiftKey && e.target === tabbables[0]) {
      e.preventDefault();
      this.trigger.focus();
    } else if (!e.shiftKey && e.target === tabbables[tabbables.length - 1]) {
      // refocus the trigger so the default Tab continues to the next nav item
      this.trigger.focus();
      this.close({ cascade: true });
    }
  }

  // --- Core Actions ---

  open(options = { cascade: true }) {
    if (this.isOpen) return;
    clearTimeout(this._aimTimer);

    // Capture the open sibling so the container morphs from its geometry instead of reopening.
    const morphSource = this.mode === "morph" ? this.getOpenMorphSibling() : null;
    if (morphSource) morphSource._morphTakeover = true;

    this.closeSiblings();
    if (morphSource) morphSource._morphTakeover = false;
    this.isOpen = true;
    if (this.isFlyout) this.openAncestors();

    this.dropdown.classList.add("is-open");
    this.trigger.classList.add("active");
    this.trigger.setAttribute("aria-expanded", "true");

    if (this.mode === "dropdown") {
      this.updatePosition();
      this.detectCollision();
    } else if (this.mode === "morph") {
      this.openMorphPanel(morphSource);
    } else if (this.mode === "accordion") {
      this.contentWrapper.style.maxHeight = `${this.contentWrapper.scrollHeight}px`;
      if (this.parentInstance) this.parentInstance.updateAccordionHeight();
      
      // Scroll the opened accordion into view once animations settle (avoids landing in the wrong spot).
      setTimeout(() => {
        const scrollableParent = getScrollableParent(this.trigger);
        
        if (scrollableParent) {
          const offset = 80; // px from the top for comfortable viewing
          const triggerRect = this.trigger.getBoundingClientRect();
          const containerRect = scrollableParent.getBoundingClientRect();
          const relativeTop = triggerRect.top - containerRect.top;
          const targetScrollTop = scrollableParent.scrollTop + relativeTop - offset;
          
          scrollableParent.scrollTo({
            top: targetScrollTop,
            behavior: 'smooth'
          });
        }
      }, 200); // Wait for accordion animation to complete
    } else if (this.mode === "stacked") {
      this.contentWrapper.classList.add("open");
    }

    RectCache.invalidate(); // geometry changed — drop stale aim rects
    this.dispatchDropdownEvent("open");
    this.dispatchDropdownEvent(`open:${this.mode}`);
  }

  close(options = { cascade: true }) {
    if (!this.isOpen) return;
    
    if (options.cascade) this.closeChildren();
    
    this.isOpen = false;
    this.isClickLocked = false;
    this.dropdown.classList.remove("is-open");
    this.trigger.classList.remove("active");
    this.trigger.setAttribute("aria-expanded", "false");

    if (this.mode === "accordion") {
      if (this.contentWrapper.style.maxHeight === "none") {
        this.contentWrapper.style.maxHeight = `${this.contentWrapper.scrollHeight}px`;
        this.contentWrapper.offsetHeight; // force reflow
      }
      this.contentWrapper.style.maxHeight = "0px";
      if (this.parentInstance) this.parentInstance.updateAccordionHeight();
    }

    if (this.mode === "stacked") {
      this.contentWrapper.classList.remove("open");
    }

    if (this.mode === "morph") {
      if (this._morphTakeover) {
        // a sibling is opening: it animates this panel out and reuses the container
        this._morphTakeover = false;
      } else {
        this.hideMorphPanel(0);
        morphShared.hide();
      }
    }

    RectCache.invalidate(); // geometry changed — drop stale aim rects
    this.dispatchDropdownEvent("close", { cascade: options.cascade });
    this.dispatchDropdownEvent(`close:${this.mode}`, { cascade: options.cascade });

    if (this.parentInstance) this.parentInstance.onChildClosed();
  }

  toggle(options = { cascade: true }) {
    this.isOpen ? this.close(options) : this.open(options);
  }

  // --- Event Handlers ---

  handleTriggerClick(e) {
    e.preventDefault();
    e.stopPropagation();
    this.toggle();
  }

  handleHoverModeClick(e) {
    e.preventDefault();
    e.stopPropagation();
    if (this.isOpen && !this.isClickLocked) {
      this.isClickLocked = true;
    } else if (this.isOpen && this.isClickLocked) {
      this.close();
    } else {
      this.open();
      this.isClickLocked = true;
    }
  }

  handleTriggerMouseEnter() {
    if (this.isClickLocked) return;
    clearTimeout(this.hoverTimeout);
    // Safe triangle: if the pointer is heading toward an open sibling's panel, defer opening
    // this one so a diagonal across this trigger doesn't steal the menu.
    if (this.shouldDeferForAim()) return;
    if (this.shouldDeferForMorphAim()) return;
    this.open();
  }

  // The open same-level sibling whose panel the pointer might be heading toward.
  getAimTarget() {
    return allDropdownInstances.find(
      (o) => o !== this && o.isOpen && o.mode === "dropdown" &&
             o.parentInstance === this.parentInstance
    ) || null;
  }

  // Is the pointer travelling back toward this dropdown (its trigger or content)? Keeps it open on return.
  isAimingAtMe() {
    // Morph: the panel lives in the shared container, so heading into it counts as heading toward me.
    if (this.mode === "morph") {
      const container = morphShared.container;
      return (!!container && HOVER_AIM.isAimingAt(RectCache.rect(container))) ||
             HOVER_AIM.isAimingAt(RectCache.rect(this.trigger));
    }
    if (this.mode !== "dropdown") return false;
    return HOVER_AIM.isAimingAt(RectCache.rect(this.contentWrapper)) ||
           HOVER_AIM.isAimingAt(RectCache.rect(this.trigger));
  }

  shouldDeferForAim() {
    if (this.mode !== "dropdown") return false; // morph swaps are intentional
    // Defer activation while the pointer is busy with the current chain: into an open
    // sibling's panel (forward) or back toward an ancestor's trigger (returning to parent).
    const sibling = this.getAimTarget();
    let aiming = !!sibling && HOVER_AIM.isAimingAt(RectCache.rect(sibling.contentWrapper));
    for (let p = this.parentInstance; p && !aiming; p = p.parentInstance) {
      if (p.mode === "dropdown" && HOVER_AIM.isAimingAt(RectCache.rect(p.trigger))) aiming = true;
    }
    if (!aiming) return false;
    // Defer and re-check shortly; the open panel keeps itself alive via its own aim-aware close loop.
    clearTimeout(this._aimTimer);
    this._aimTimer = setTimeout(() => {
      if (this.isClickLocked) return;
      if (this.trigger.matches(":hover")) this.handleTriggerMouseEnter();
    }, AIM_TOLERANCE);
    return true;
  }

  // Morph safe-triangle, one-way: panels share a sliding container, so sideways swaps along the
  // trigger row are intentional and instant. We only guard the dive from a trigger into the open
  // container, where a shallow diagonal can graze a neighbour and fire a stray morph.
  shouldDeferForMorphAim() {
    if (this.mode !== "morph") return false;
    if (!this.getOpenMorphSibling()) return false; // nothing open to protect
    const container = morphShared.container;
    if (!container || !HOVER_AIM.isAimingAt(RectCache.rect(container))) return false;
    clearTimeout(this._aimTimer);
    this._aimTimer = setTimeout(() => {
      if (this.isClickLocked) return;
      if (this.trigger.matches(":hover")) this.handleTriggerMouseEnter();
    }, AIM_TOLERANCE);
    return true;
  }

  handleTriggerMouseLeave() {
    if (this.isClickLocked) return;
    this.scheduleClose(250);
  }

  // Close after `graceMs`. In dropdown/morph the close is aim-aware (the panel survives while the
  // pointer travels toward or back to it); `graceMs` only applies to the non-aim-aware modes.
  scheduleClose(graceMs) {
    clearTimeout(this.hoverTimeout);
    clearTimeout(this._aimTimer);
    if (this.mode === "dropdown" || this.mode === "morph") {
      this._closeDeadline = null;
      this._aimAwareTick();
    } else {
      this.hoverTimeout = setTimeout(() => this.checkAndCloseIfUnused(), graceMs);
    }
  }

  _aimAwareTick() {
    if (this.isClickLocked || !this.isOpen) { this._closeDeadline = null; return; }
    // Back on the trigger or content — the enter handlers own it now.
    if (this.trigger.matches(":hover") || this.contentWrapper.matches(":hover")) {
      this._closeDeadline = null;
      return;
    }
    if (this.isAimingAtMe()) {
      this._closeDeadline = null; // still heading in/back — reset the grace countdown
      this.hoverTimeout = setTimeout(() => this._aimAwareTick(), AIM_TOLERANCE);
      return;
    }
    const now = performance.now();
    if (this._closeDeadline == null) this._closeDeadline = now + AIM_CLOSE_GRACE;
    if (now >= this._closeDeadline) {
      this._closeDeadline = null;
      this.checkAndCloseIfUnused();
      return;
    }
    this.hoverTimeout = setTimeout(() => this._aimAwareTick(), AIM_TOLERANCE);
  }

  handleContentMouseEnter() {
    if (this.isClickLocked) return;
    clearTimeout(this.hoverTimeout);
  }

  handleContentMouseLeave() {
    if (this.isClickLocked) return;
    this.scheduleClose(150);
  }

  checkAndCloseIfUnused() {
    if (this.isClickLocked || !this.isOpen || !this.isFlyout) return;
    const overOwnTrigger = this.trigger.matches(":hover");
    const overOwnContent = this.contentWrapper.matches(":hover");
    const overStripeContainer = this.mode === "morph" && !!(morphShared.container && morphShared.container.matches(":hover"));
    if (!overOwnTrigger && !overOwnContent && !overStripeContainer && !this.hasOpenDescendant()) {
      this.close();
    }
  }

  onChildClosed() {
    if (this.isFlyout && !this.isClickLocked && this.isOpen) {
      this.scheduleClose(50);
    }
  }

  handleFocusOut(e) {
    if (!this.isOpen || this.mode === "stacked") return;
    setTimeout(() => {
      const active = document.activeElement;
      const insideSelf = this.dropdown.contains(active) || this.contentWrapper.contains(active);
      const insideAnyChild = this.childInstances.some((child) => child.dropdown.contains(active) || child.contentWrapper.contains(active));
      if (!insideSelf && !insideAnyChild) this.close();
    }, 0);
  }

  handleStackedKeydown(e) {
    if (this.mode !== "stacked" || !this.isOpen || document.activeElement !== this.trigger) return;
    if (e.key === "Tab" && !e.shiftKey) {
      const tabbables = getTabbableElements(this.contentWrapper);
      if (tabbables.length) {
        window.__stackedIsManagingFocus = true;
        e.preventDefault();
        tabbables[0].focus();
        setTimeout(() => { window.__stackedIsManagingFocus = false; }, 0);
      }
    }
  }

  handleStackedFocusIn() {
    if (this.mode === "stacked") this.stackedContentHasFocus = true;
  }

  handleStackedFocusOut() {
    if (this.mode !== "stacked") return;
    setTimeout(() => {
      const active = document.activeElement;
      const stillInTree = this.dropdown.contains(active) || this.contentWrapper.contains(active) || 
                          this.childInstances.some(c => c.dropdown.contains(active) || c.contentWrapper.contains(active));
      const anyChildOpen = this.childInstances.some(c => c.isOpen);
      if (!stillInTree && this.stackedContentHasFocus && !anyChildOpen) {
        this.stackedContentHasFocus = false;
        this.close({ cascade: false });
        this.trigger.focus();
      }
    }, 0);
  }

  handleBackButtonClick(e) {
    e.preventDefault();
    e.stopPropagation();
    this.close({ cascade: false });
    this.trigger.focus();
  }

  // --- Hierarchy & Positioning Logic ---

  addChild(child) {
    if (!this.childInstances.includes(child)) this.childInstances.push(child);
  }

  closeSiblings() {
    allDropdownInstances.forEach((other) => {
      if (other === this || this.isAncestorOf(other) || other.isAncestorOf(this)) return;
      if (other.parentInstance === this.parentInstance && other.isOpen) other.close({ cascade: true });
    });
  }

  closeChildren() {
    this.childInstances.forEach((child) => child.isOpen && child.close({ cascade: true }));
  }

  openAncestors() {
    let current = this.parentInstance;
    while (current) {
      if (current.isFlyout && !current.isOpen) current.open({ cascade: false });
      current = current.parentInstance;
    }
  }

  hasOpenDescendant() {
    return this.childInstances.some((child) => child.isOpen || child.hasOpenDescendant());
  }

  isAncestorOf(other) {
    let current = other.parentInstance;
    while (current) {
      if (current === this) return true;
      current = current.parentInstance;
    }
    return false;
  }

  resetPositioning() {
    const s = this.contentWrapper.style;
    s.insetInlineStart = "";
    s.insetInlineEnd = "";
    s.insetBlockStart = "";
    s.insetBlockEnd = "";
    s.maxInlineSize = "";
    s.inlineSize = "";
    this.contentWrapper.classList.remove("position-right", "position-left", "position-top", "position-bottom", "position-center");
    this.dropdown.classList.remove("width-match");
  }

  updatePosition() {
    if (this.mode !== "dropdown" || !this.config.widthMatch || this.level !== 0) return;
    
    const target = document.querySelector(this.config.widthMatch);
    if (!target) return;
    
    const isRTL = getIsRTL();
    const targetRect = target.getBoundingClientRect();
    const dropdownRect = this.dropdown.getBoundingClientRect();
    
    // logical inline-start offset (direction-aware)
    const offsetInlineStart = isRTL 
      ? dropdownRect.right - targetRect.right 
      : targetRect.left - dropdownRect.left;
    
    this.contentWrapper.style.inlineSize = `${targetRect.width}px`;
    this.contentWrapper.style.insetInlineStart = `${offsetInlineStart}px`;
    this.dropdown.classList.add("width-match");
  }

  updateAccordionHeight() {
    if (this.mode !== "accordion" || !this.isOpen) return;
    if (this.contentWrapper.style.maxHeight !== "none") {
      this.contentWrapper.style.maxHeight = `${this.contentWrapper.scrollHeight}px`;
    }
    if (this.parentInstance) this.parentInstance.updateAccordionHeight();
  }

  detectCollision(forceCheck = false) {
    if (this.mode !== "dropdown") return;
    if (!this.isOpen && !forceCheck) return;

    const cw = this.contentWrapper;
    const triggerRect = this.trigger.getBoundingClientRect();
    const viewportWidth = window.innerWidth;
    const viewportHeight = window.innerHeight;
    const scrollbarWidth = window.innerWidth - document.documentElement.clientWidth;
    const padding = DROPDOWN_VIEWPORT_PADDING;
    const isRTL = getIsRTL();

    const posClasses = ["position-right", "position-left", "position-top", "position-bottom", "position-center"];
    cw.classList.remove(...posClasses);
    this.dropdown.classList.remove(...posClasses);

    const addClass = (cls) => {
      cw.classList.add(cls);
      this.dropdown.classList.add(cls);
    };

    const rect = cw.getBoundingClientRect();

    if (this.level === 0) {
      if (!this.config.widthMatch) {
        const overflowInlineEnd = isRTL 
          ? rect.left < padding 
          : rect.right > viewportWidth - scrollbarWidth - padding;
        const overflowInlineStart = isRTL 
          ? rect.right > viewportWidth - scrollbarWidth - padding 
          : rect.left < padding;

        if (overflowInlineEnd && !overflowInlineStart) {
          cw.style.insetInlineStart = "auto";
          cw.style.insetInlineEnd = "0";
          addClass("position-right");
        } else if (overflowInlineStart && !overflowInlineEnd) {
          cw.style.insetInlineStart = "0";
          cw.style.insetInlineEnd = "auto";
          addClass("position-left");
        } else if (overflowInlineEnd && overflowInlineStart) {
          const triggerCenter = triggerRect.left + triggerRect.width / 2;
          const leftPosition = triggerCenter - rect.width / 2;
          cw.style.insetInlineStart = `${leftPosition - triggerRect.left}px`;
          cw.style.insetInlineEnd = "auto";
          addClass("position-center");
        }
      } else {
        const overflowInlineEnd = isRTL ? rect.left < padding : rect.right > viewportWidth - scrollbarWidth - padding;
        const overflowInlineStart = isRTL ? rect.right > viewportWidth - scrollbarWidth - padding : rect.left < padding;
        
        const targetElement = document.querySelector(this.config.widthMatch);
        const targetRect = targetElement?.getBoundingClientRect();
        const isFullWidthTarget = targetRect && targetRect.width >= viewportWidth - padding * 2;
        
        if (!isFullWidthTarget && (overflowInlineEnd || overflowInlineStart)) {
          cw.style.maxInlineSize = `calc(100vw - ${padding * 2}px)`;
        } else {
          cw.style.maxInlineSize = "";
        }
      }
    } else {
      // Nested submenus
      const overflowInlineEnd = isRTL ? rect.left < padding : rect.right > viewportWidth - scrollbarWidth - padding;
      const spaceOnPhysicalLeft = triggerRect.left;
      const spaceOnPhysicalRight = viewportWidth - triggerRect.right;
      const hasMoreSpaceOnInlineStart = isRTL ? spaceOnPhysicalRight > spaceOnPhysicalLeft : spaceOnPhysicalLeft > spaceOnPhysicalRight;

      if (overflowInlineEnd && hasMoreSpaceOnInlineStart) {
        addClass("position-left");
      } else {
        addClass("position-right");
      }
    }

    // Vertical
    const dropdownRect = cw.getBoundingClientRect();
    const overflowBottom = dropdownRect.bottom > viewportHeight - padding;
    const spaceAbove = triggerRect.top;
    const spaceBelow = viewportHeight - triggerRect.bottom;

    if (this.level === 0) {
      if (overflowBottom && spaceAbove > spaceBelow && spaceAbove > dropdownRect.height) {
        cw.style.insetBlockStart = "auto";
        cw.style.insetBlockEnd = "100%";
        cw.style.marginBlockStart = "0";
        addClass("position-top");
      } else if (overflowBottom) {
        addClass("position-bottom");
      } else {
        addClass("position-bottom");
      }
    } else {
      const overflowTop = dropdownRect.top < padding;
      if (overflowBottom && !overflowTop) {
        cw.style.insetBlockStart = "auto";
        cw.style.insetBlockEnd = "0";
        addClass("position-top");
      } else if (overflowBottom && overflowTop) {
        cw.style.insetBlockStart = "0";
        addClass("position-bottom");
      } else {
        cw.style.insetBlockStart = "0";
        cw.style.insetBlockEnd = "auto";
        addClass("position-bottom");
      }
    }
  }

  dispatchDropdownEvent(type, extra = {}) {
    const event = new CustomEvent(`menuDropdown:${type}`, {
      bubbles: true,
      detail: { instanceId: this.id, mode: this.mode, level: this.level, ...extra },
    });
    this.dropdown.dispatchEvent(event);
  }

  // Position a closed dropdown by measuring it invisibly, then restoring it. Used on load/resize.
  repositionForMeasurement() {
    if (this.mode !== "dropdown") return;
    
    const cw = this.contentWrapper;
    
    const originalVisibility = cw.style.visibility;
    const originalOpacity = cw.style.opacity;
    const originalPointerEvents = cw.style.pointerEvents;
    const originalPosition = cw.style.position;
    
    // measure while invisible to the user
    cw.style.visibility = "hidden";
    cw.style.opacity = "0";
    cw.style.pointerEvents = "none";
    
    if (!originalPosition || originalPosition === "static") {
      cw.style.position = "absolute";
    }
    
    // force display if CSS hid it
    const computedDisplay = getComputedStyle(cw).display;
    const originalDisplay = cw.style.display;
    if (computedDisplay === "none") {
      cw.style.display = "block";
    }
    
    this.detectCollision(true);

    cw.style.visibility = originalVisibility;
    cw.style.opacity = originalOpacity;
    cw.style.pointerEvents = originalPointerEvents;
    cw.style.position = originalPosition;
    cw.style.display = originalDisplay;
  }
}

// --- Global Handlers ---

// Reposition all dropdown-mode dropdowns to prevent viewport overflow. Called on load and resize.
function repositionAllDropdowns() {
  allDropdownInstances.forEach((inst) => {
    if (inst.mode === "dropdown") {
      if (inst.isOpen) {
        inst.updatePosition();
        inst.detectCollision();
      } else {
        inst.repositionForMeasurement();
      }
    } else if (inst.mode === "morph" && inst.isOpen) {
      inst.refreshMorphGeometry();
    } else if (inst.mode === "accordion" && inst.isOpen) {
      inst.updateAccordionHeight();
    }
  });
}

window.repositionAllDropdowns = repositionAllDropdowns;

if (!window._dropdownGlobalHandlersSetup) {
  window._dropdownGlobalHandlersSetup = true;
  document.addEventListener("click", (e) => {
    allDropdownInstances.filter(i => i.isOpen).forEach(i => {
      if (i.isFlyout && !i.dropdown.contains(e.target) && !i.contentWrapper.contains(e.target)) i.close({ cascade: true });
    });
  });
  document.addEventListener("keydown", (e) => {
    if (e.key !== "Escape") return;
    const top = allDropdownInstances
      .filter(i => i.isOpen && i.mode !== "accordion")
      .sort((a, b) => b.level - a.level)[0];
    if (top) { 
      top.close({ cascade: false }); 
      top.trigger.focus(); 
      e.preventDefault(); 
    }
  });
  // Any scroll (capture catches inner scrollers too) moves the menu's rects, so drop the aim cache.
  document.addEventListener("scroll", () => RectCache.invalidate(), { passive: true, capture: true });
  window.addEventListener("resize", () => {
    RectCache.invalidate();
    clearTimeout(window._dropdownResizeTimeout);
    window._dropdownResizeTimeout = setTimeout(() => {
      repositionAllDropdowns();
    }, 150);
  });
}

// --- Initialization ---
const dropdownElements = document.querySelectorAll('[data-menu-element="dropdown"]');
const instanceMap = new Map();

dropdownElements.forEach((el, i) => {
  const inst = new Dropdown(el, i);
  if (inst.trigger) instanceMap.set(el, inst);
});

// Wiring
dropdownElements.forEach((el) => {
  const inst = instanceMap.get(el);
  if (!inst) return;
  const parentEl = el.parentElement.closest('[data-menu-element="dropdown"]');
  if (parentEl) {
    const parentInst = instanceMap.get(parentEl);
    if (parentInst) {
      inst.parentInstance = parentInst;
      parentInst.addChild(inst);
      inst.level = parentInst.level + 1;
    }
  }
});

// Final labels & Init
allDropdownInstances.forEach((inst) => {
  const label = inst.dropdown.querySelector(':scope > [data-menu-element="dropdown-content"] > [data-menu-element="back-button"] [data-menu-element="back-button-label"]');
  if (label && inst.parentInstance) {
    const pLabel = inst.parentInstance.trigger.querySelector('[data-menu-element="dropdown-label"]');
    if (pLabel) {
      label.textContent = pLabel.textContent;
      inst.backButton.setAttribute("aria-label", `Back to ${pLabel.textContent} Menu`);
    } else if (window.console) {
      console.warn('⚠️ [Dropdown] Parent dropdown label [data-menu-element="dropdown-label"] not found for back button update:', inst.parentInstance.dropdown);
    }
  }
  inst.init();
});

// Reposition on load, then again shortly after to catch late layout shifts (fonts, images).
repositionAllDropdowns();
setTimeout(() => {
  repositionAllDropdowns();
}, 100);
</script>
</body>
</html>
