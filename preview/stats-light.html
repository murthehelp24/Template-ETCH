<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stats พื้นสว่าง — preview</title>
<link rel="stylesheet" href="assets/acss-sim.css">
<style>
:where(:root) {
  /* ===== MAIN TEMPLATE COLOURS — change colours here only =====
     Header, footer and every main-* section use these variables.
     By default they follow ACSS: changing Primary / Secondary in ACSS changes the templates too. */
  --main-primary: var(--primary, #1e3a5f);    /* brand: header, footer, FAQ, headings, links, tags */
  --main-accent: var(--secondary, #e8a33d);   /* highlight: underlines, hover, eyebrow line, active */
  --main-light: var(--white, #fff);           /* light backgrounds: sections, cards, article box */
  --main-text: var(--text-dark, #1a1a1a);     /* text on light backgrounds */
  --main-on-primary: var(--white, #fff);      /* text and icons on the primary colour */

  /* derived from the five colours above — no need to edit */
  --main-light-alt: color-mix(in srgb, var(--main-primary) 6%, var(--main-light));
  --main-text-muted: color-mix(in srgb, var(--main-text) 72%, transparent);
  --main-on-primary-muted: color-mix(in srgb, var(--main-on-primary) 78%, transparent);
  --main-line: color-mix(in srgb, var(--main-primary) 18%, transparent);
  --main-line-on-primary: color-mix(in srgb, var(--main-on-primary) 18%, transparent);
  --main-accent-soft: color-mix(in srgb, var(--main-accent) 20%, var(--main-light));
  --main-shadow: color-mix(in srgb, var(--main-text) 12%, transparent);
}

:where([data-etch-element="section"]) {
  inline-size: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
}

:where([data-etch-element="container"]) {
  inline-size: 100%;
  display: flex;
  flex-direction: column;
  max-inline-size: var(--content-width, 1366px);
  align-self: center; margin-inline: auto;
}

.main-stats-light {
  padding-block: var(--section-space-s);
  background-color: var(--main-light);
}

.main-stats-light__grid {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  margin: 0;
  padding: 0;
  list-style: none;
  text-align: center;

  @media (width <= 768px) {
    grid-template-columns: repeat(2, minmax(0, 1fr));
    row-gap: var(--space-l);
  }
}

.main-stats-light__item {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: var(--space-xs);
  padding-inline: var(--space-s);

  & + & {
    border-inline-start: 1px solid var(--main-line);
  }

  @media (width <= 768px) {
    &:nth-child(odd) {
      border-inline-start: 0;
    }
  }
}

.main-stats-light__number {
  margin: 0;
  font-size: var(--h1);
  font-weight: 800;
  line-height: 1;
  color: var(--main-primary);

  /* short accent line under the number */
  &::after {
    content: "";
    display: block;
    inline-size: calc(32 * 1rem / var(--etch-root-px, 10));
    block-size: 3px;
    margin: var(--space-xs) auto 0;
    background-color: var(--main-accent);
  }
}

.main-stats-light__label {
  margin: 0;
  color: var(--main-text-muted);
}
</style>
</head>
<body data-template="stats-light">
<section data-etch-element="section" class="main-stats-light"><div data-etch-element="container"><ul class="main-stats-light__grid"><li class="main-stats-light__item"><p class="main-stats-light__number" data-pv-edit="t:g.0.0.0.0.0">15+</p><p class="main-stats-light__label" data-pv-edit="t:g.0.0.0.1.0">Years of experience</p></li><li class="main-stats-light__item"><p class="main-stats-light__number" data-pv-edit="t:g.0.0.1.0.0">2,000+</p><p class="main-stats-light__label" data-pv-edit="t:g.0.0.1.1.0">Happy customers</p></li><li class="main-stats-light__item"><p class="main-stats-light__number" data-pv-edit="t:g.0.0.2.0.0">98%</p><p class="main-stats-light__label" data-pv-edit="t:g.0.0.2.1.0">Would recommend us</p></li><li class="main-stats-light__item"><p class="main-stats-light__number" data-pv-edit="t:g.0.0.3.0.0">24/7</p><p class="main-stats-light__label" data-pv-edit="t:g.0.0.3.1.0">Online support</p></li></ul></div></section>
<script src="assets/frame.js"></script>

</body>
</html>
