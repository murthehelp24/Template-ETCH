<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>รูป + ข้อความ ป้ายประสบการณ์ — preview</title>
<link rel="stylesheet" href="assets/acss-sim.css">
<style>
:where(:root) {
  /* ===== MAIN TEMPLATE COLOURS — change colours here only =====
     Header, footer and every main-* section use these variables.
     By default they follow ACSS: changing Primary / Secondary in ACSS changes the templates too. */
  --main-primary: var(--primary, #1e3a5f);    /* brand: header, footer, FAQ, headings, links, tags */
  --main-accent: var(--secondary, #e8a33d);   /* highlight: underlines, hover, eyebrow line, active */
  --main-light: var(--white, #fff);           /* light backgrounds: sections, cards, article box */
  --main-text: var(--text-dark, #1a1a1a);     /* text on light backgrounds */
  --main-on-primary: var(--white, #fff);      /* text and icons on the primary colour */

  /* derived from the five colours above — no need to edit */
  --main-light-alt: color-mix(in srgb, var(--main-primary) 6%, var(--main-light));
  --main-text-muted: color-mix(in srgb, var(--main-text) 72%, transparent);
  --main-on-primary-muted: color-mix(in srgb, var(--main-on-primary) 78%, transparent);
  --main-line: color-mix(in srgb, var(--main-primary) 18%, transparent);
  --main-line-on-primary: color-mix(in srgb, var(--main-on-primary) 18%, transparent);
  --main-accent-soft: color-mix(in srgb, var(--main-accent) 20%, var(--main-light));
  --main-shadow: color-mix(in srgb, var(--main-text) 12%, transparent);
}

:where([data-etch-element="section"]) {
  inline-size: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
}

:where([data-etch-element="container"]) {
  inline-size: 100%;
  display: flex;
  flex-direction: column;
  max-inline-size: var(--content-width, 1366px);
  align-self: center; margin-inline: auto;
}

.main-heading {
  display: flex;
  flex-direction: column;
  gap: var(--space-xs);
  max-inline-size: calc(600 * 1rem / var(--etch-root-px, 10));
}

.main-heading--center {
  align-items: center;
  margin-inline: auto;
  text-align: center;
}

.main-heading__eyebrow {
  display: flex;
  align-items: center;
  gap: var(--space-xs);
  font-size: var(--text-s);
  font-weight: 600;
  letter-spacing: 0.08em;
  color: var(--main-primary);

  &::before {
    content: "";
    inline-size: calc(24 * 1rem / var(--etch-root-px, 10));
    block-size: 2px;
    background-color: var(--main-accent);
  }
}

.main-heading__intro {
  color: var(--main-text-muted);
}

.main-media__img {
  /* image ratio: set --main-media-ratio on a parent */
  display: block;
  inline-size: 100%;
  block-size: auto;
  aspect-ratio: var(--main-media-ratio, 4 / 3);
  border-radius: var(--radius-m);
  background-color: var(--main-light-alt);
  object-fit: cover;
}

.main-buttons {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: var(--space-s);
}

.main-checks {
  display: flex;
  flex-direction: column;
  gap: var(--space-xs);
  margin: 0;
  padding: 0;
  list-style: none;
}

.main-checks__item {
  display: flex;
  align-items: flex-start;
  gap: var(--space-xs);
}

.main-checks__icon {
  flex: none;
  inline-size: calc(24 * 1rem / var(--etch-root-px, 10));
  block-size: calc(24 * 1rem / var(--etch-root-px, 10));
  padding: calc(var(--space-xs) / 2);
  border-radius: 50%;
  background-color: var(--main-accent-soft);
  color: var(--main-primary);
}

.main-split-overlap {
  background-color: var(--main-light);
}

.main-split-overlap__grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(min(100%, calc(360 * 1rem / var(--etch-root-px, 10))), 1fr));
  gap: var(--container-gap);
  align-items: center;
}

.main-split-overlap__media {
  /* the accent block peeks out behind the photo */
  position: relative;
  isolation: isolate;
  margin: var(--space-m) var(--space-m) var(--space-m) 0;

  --main-media-ratio: 4 / 5;

  &::before {
    content: "";
    position: absolute;
    inset: calc(var(--space-m) * -1) calc(var(--space-m) * -1) var(--space-xl) var(--space-xl);
    z-index: -1;
    border-radius: var(--radius-l);
    background-color: var(--main-accent-soft);
  }
}

.main-split-overlap__badge {
  position: absolute;
  inset-block-end: var(--space-m);
  inset-inline-start: calc(var(--space-m) * -1);
  display: flex;
  flex-direction: column;
  padding: var(--space-s) var(--space-m);
  border-radius: var(--radius-m);
  background-color: var(--main-primary);
  box-shadow: 0 calc(12 * 1rem / var(--etch-root-px, 10)) calc(28 * 1rem / var(--etch-root-px, 10)) var(--main-shadow);
  color: var(--main-on-primary);

  @media (width <= 768px) {
    inset-inline-start: var(--space-s);
  }
}

.main-split-overlap__badge-value {
  font-size: var(--h2);
  font-weight: 800;
  line-height: 1;
  color: var(--main-accent);
}

.main-split-overlap__badge-label {
  font-size: var(--text-s);
}

.main-split-overlap__content {
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: var(--content-gap);
}
</style>
</head>
<body data-template="split-overlap">
