<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hero พื้นสีหลัก — preview</title>
<link rel="stylesheet" href="assets/acss-sim.css">
<style>
:where(:root) {
  /* ===== MAIN TEMPLATE COLOURS — change colours here only =====
     Header, footer and every main-* section use these variables.
     By default they follow ACSS: changing Primary / Secondary in ACSS changes the templates too. */
  --main-primary: var(--primary, #1e3a5f);    /* brand: header, footer, FAQ, headings, links, tags */
  --main-accent: var(--secondary, #e8a33d);   /* highlight: underlines, hover, eyebrow line, active */
  --main-light: var(--white, #fff);           /* light backgrounds: sections, cards, article box */
  --main-text: var(--text-dark, #1a1a1a);     /* text on light backgrounds */
  --main-on-primary: var(--white, #fff);      /* text and icons on the primary colour */

  /* derived from the five colours above — no need to edit */
  --main-light-alt: color-mix(in srgb, var(--main-primary) 6%, var(--main-light));
  --main-text-muted: color-mix(in srgb, var(--main-text) 72%, transparent);
  --main-on-primary-muted: color-mix(in srgb, var(--main-on-primary) 78%, transparent);
  --main-line: color-mix(in srgb, var(--main-primary) 18%, transparent);
  --main-line-on-primary: color-mix(in srgb, var(--main-on-primary) 18%, transparent);
  --main-accent-soft: color-mix(in srgb, var(--main-accent) 20%, var(--main-light));
  --main-shadow: color-mix(in srgb, var(--main-text) 12%, transparent);
}

:where([data-etch-element="section"]) {
  inline-size: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
}

:where([data-etch-element="container"]) {
  inline-size: 100%;
  display: flex;
  flex-direction: column;
  max-inline-size: var(--content-width, 1366px);
  align-self: center; margin-inline: auto;
}

.main-heading {
  display: flex;
  flex-direction: column;
  gap: var(--space-xs);
  max-inline-size: calc(600 * 1rem / var(--etch-root-px, 10));
}

.main-heading--center {
  align-items: center;
  margin-inline: auto;
  text-align: center;
}

.main-heading__eyebrow {
  display: flex;
  align-items: center;
  gap: var(--space-xs);
  font-size: var(--text-s);
  font-weight: 600;
  letter-spacing: 0.08em;
  color: var(--main-primary);

  &::before {
    content: "";
    inline-size: calc(24 * 1rem / var(--etch-root-px, 10));
    block-size: 2px;
    background-color: var(--main-accent);
  }
}

.main-heading__intro {
  color: var(--main-text-muted);
}

.main-buttons {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: var(--space-s);
}

.main-hero-panel {
  padding: 0;
  overflow: hidden;
  background-color: var(--main-primary);
  color: var(--main-on-primary);

  :is(h1, h2, h3, h4, h5, h6),
  .main-heading__eyebrow {
    color: inherit;
  }

  .main-heading__intro {
    color: var(--main-on-primary-muted);
  }
}

.main-hero-panel__grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  inline-size: 100%;
  min-block-size: calc(800 * 1rem / var(--etch-root-px, 10)); /* same height as the full-image heroes */

  @media (width <= 992px) {
    grid-template-columns: 1fr;
  }
}

.main-hero-panel__content {
  /* lines up with the page container on the left */
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: flex-start;
  gap: var(--content-gap);
  padding-block: var(--section-space-l);
  padding-inline: max(var(--gutter), calc((100vw - var(--content-width, 1366px)) / 2)) var(--space-xl);

  @media (width <= 992px) {
    padding-inline: var(--gutter);
  }
}

.main-hero-panel__media {
  margin: 0;
  overflow: hidden;
  border-end-start-radius: calc(120 * 1rem / var(--etch-root-px, 10));
  background-color: var(--main-light-alt);

  @media (width <= 992px) {
    aspect-ratio: 4 / 3;
    border-end-start-radius: 0;
    border-start-start-radius: calc(60 * 1rem / var(--etch-root-px, 10));
  }
}

.main-hero-panel__img {
  display: block;
  inline-size: 100%;
  block-size: 100%;
  object-fit: cover;
}
</style>
</head>
<body data-template="hero-panel">
<section data-etch-element="section" class="main-hero-panel"><div class="main-hero-panel__grid"><div class="main-hero-panel__content"><div class="main-heading"><p class="main-heading__eyebrow" data-pv-edit="t:g.0.0.0.0.0">Welcome</p><h1 data-pv-edit="t:g.0.0.0.1.0">A clear headline that says what you do and for whom</h1><p class="main-heading__intro" data-pv-edit="t:g.0.0.0.2.0">One or two sentences about the main benefit. Keep it short and specific.</p></div><div class="main-buttons"><a class="btn--secondary" href="https://line.me/R/ti/p/@example" target="_blank" rel="noopener" data-pv-edit="t:g.0.0.1.0.0">Chat on LINE</a><a class="btn--secondary btn--outline" href="/services/" data-pv-edit="t:g.0.0.1.1.0">Our services</a></div></div><figure class="main-hero-panel__media"><img class="main-hero-panel__img" loading="eager" data-pv-img="i:g.0.1.0" src="data:image/svg+xml;utf8,&lt;svg xmlns=&#x27;http://www.w3.org/2000/svg&#x27; viewBox=&#x27;0 0 400 300&#x27; preserveAspectRatio=&#x27;xMidYMid slice&#x27;&gt;&lt;rect width=&#x27;400&#x27; height=&#x27;300&#x27; fill=&#x27;%23b8bfc9&#x27; fill-opacity=&#x27;.35&#x27;/&gt; &lt;circle cx=&#x27;290&#x27; cy=&#x27;95&#x27; r=&#x27;34&#x27; fill=&#x27;%23ffffff&#x27; fill-opacity=&#x27;.6&#x27;/&gt; &lt;path d=&#x27;M0 300 L120 150 L200 240 L260 180 L400 300 Z&#x27; fill=&#x27;%23778293&#x27; fill-opacity=&#x27;.45&#x27;/&gt;&lt;/svg&gt;" alt=""></figure></div></section>
<script src="assets/frame.js"></script>

</body>
</html>
