<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stats หัวข้อ + ตัวเลข — preview</title>
<link rel="stylesheet" href="assets/acss-sim.css">
<style>
:where(:root) {
  /* ===== MAIN TEMPLATE COLOURS — change colours here only =====
     Header, footer and every main-* section use these variables.
     By default they follow ACSS: changing Primary / Secondary in ACSS changes the templates too. */
  --main-primary: var(--primary, #1e3a5f);    /* brand: header, footer, FAQ, headings, links, tags */
  --main-accent: var(--secondary, #e8a33d);   /* highlight: underlines, hover, eyebrow line, active */
  --main-light: var(--white, #fff);           /* light backgrounds: sections, cards, article box */
  --main-text: var(--text-dark, #1a1a1a);     /* text on light backgrounds */
  --main-on-primary: var(--white, #fff);      /* text and icons on the primary colour */

  /* derived from the five colours above — no need to edit */
  --main-light-alt: color-mix(in srgb, var(--main-primary) 6%, var(--main-light));
  --main-text-muted: color-mix(in srgb, var(--main-text) 72%, transparent);
  --main-on-primary-muted: color-mix(in srgb, var(--main-on-primary) 78%, transparent);
  --main-line: color-mix(in srgb, var(--main-primary) 18%, transparent);
  --main-line-on-primary: color-mix(in srgb, var(--main-on-primary) 18%, transparent);
  --main-accent-soft: color-mix(in srgb, var(--main-accent) 20%, var(--main-light));
  --main-shadow: color-mix(in srgb, var(--main-text) 12%, transparent);
}

:where([data-etch-element="section"]) {
  inline-size: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
}

:where([data-etch-element="container"]) {
  inline-size: 100%;
  display: flex;
  flex-direction: column;
  max-inline-size: var(--content-width, 1366px);
  align-self: center; margin-inline: auto;
}

.main-heading {
  display: flex;
  flex-direction: column;
  gap: var(--space-xs);
  max-inline-size: calc(600 * 1rem / var(--etch-root-px, 10));
}

.main-heading--center {
  align-items: center;
  margin-inline: auto;
  text-align: center;
}

.main-heading__eyebrow {
  display: flex;
  align-items: center;
  gap: var(--space-xs);
  font-size: var(--text-s);
  font-weight: 600;
  letter-spacing: 0.08em;
  color: var(--main-primary);

  &::before {
    content: "";
    inline-size: calc(24 * 1rem / var(--etch-root-px, 10));
    block-size: 2px;
    background-color: var(--main-accent);
  }
}

.main-heading__intro {
  color: var(--main-text-muted);
}

.main-stats-split {
  background-color: var(--main-light);
}

.main-stats-split__grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(min(100%, calc(360 * 1rem / var(--etch-root-px, 10))), 1fr));
  gap: var(--container-gap);
  align-items: center;
}

.main-stats-split__list {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: var(--grid-gap);
  margin: 0;
  padding: 0;
  list-style: none;
}

.main-stats-split__item {
  display: flex;
  flex-direction: column;
  gap: var(--space-xs);
  padding: var(--space-m);
  border-radius: var(--radius-m);
  background-color: var(--main-light-alt);

  &:nth-child(2),
  &:nth-child(3) {
    background-color: var(--main-primary);
    color: var(--main-on-primary);

    .main-stats-split__number {
      color: var(--main-accent);
    }

    .main-stats-split__label {
      color: var(--main-on-primary-muted);
    }
  }
}

.main-stats-split__number {
  margin: 0;
  font-size: var(--h1);
  font-weight: 800;
  line-height: 1;
  color: var(--main-primary);
}

.main-stats-split__label {
  margin: 0;
  color: var(--main-text-muted);
}
</style>
</head>
<body data-template="stats-split">
<section data-etch-element="section" class="main-stats-split"><div data-etch-element="container"><div class="main-stats-split__grid"><div class="main-heading"><p class="main-heading__eyebrow" data-pv-edit="t:g.0.0.0.0.0">Our results</p><h2 data-pv-edit="t:g.0.0.0.1.0">Numbers that speak for us</h2><p class="main-heading__intro" data-pv-edit="t:g.0.0.0.2.0">A short line about your experience and the customers you have helped.</p></div><ul class="main-stats-split__list"><li class="main-stats-split__item"><p class="main-stats-split__number" data-pv-edit="t:g.0.0.1.0.0.0">15+</p><p class="main-stats-split__label" data-pv-edit="t:g.0.0.1.0.1.0">Years of experience</p></li><li class="main-stats-split__item"><p class="main-stats-split__number" data-pv-edit="t:g.0.0.1.1.0.0">2,000+</p><p class="main-stats-split__label" data-pv-edit="t:g.0.0.1.1.1.0">Happy customers</p></li><li class="main-stats-split__item"><p class="main-stats-split__number" data-pv-edit="t:g.0.0.1.2.0.0">98%</p><p class="main-stats-split__label" data-pv-edit="t:g.0.0.1.2.1.0">Would recommend us</p></li><li class="main-stats-split__item"><p class="main-stats-split__number" data-pv-edit="t:g.0.0.1.3.0.0">24/7</p><p class="main-stats-split__label" data-pv-edit="t:g.0.0.1.3.1.0">Online support</p></li></ul></div></div></section>
<script src="assets/frame.js"></script>

</body>
</html>
