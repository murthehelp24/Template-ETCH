<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CTA ฟอร์ม + แผนที่ — preview</title>
<link rel="stylesheet" href="assets/acss-sim.css">
<style>
:where(:root) {
  /* ===== MAIN TEMPLATE COLOURS — change colours here only =====
     Header, footer and every main-* section use these variables.
     By default they follow ACSS: changing Primary / Secondary in ACSS changes the templates too. */
  --main-primary: var(--primary, #1e3a5f);    /* brand: header, footer, FAQ, headings, links, tags */
  --main-accent: var(--secondary, #e8a33d);   /* highlight: underlines, hover, eyebrow line, active */
  --main-light: var(--white, #fff);           /* light backgrounds: sections, cards, article box */
  --main-text: var(--text-dark, #1a1a1a);     /* text on light backgrounds */
  --main-on-primary: var(--white, #fff);      /* text and icons on the primary colour */

  /* derived from the five colours above — no need to edit */
  --main-light-alt: color-mix(in srgb, var(--main-primary) 6%, var(--main-light));
  --main-text-muted: color-mix(in srgb, var(--main-text) 72%, transparent);
  --main-on-primary-muted: color-mix(in srgb, var(--main-on-primary) 78%, transparent);
  --main-line: color-mix(in srgb, var(--main-primary) 18%, transparent);
  --main-line-on-primary: color-mix(in srgb, var(--main-on-primary) 18%, transparent);
  --main-accent-soft: color-mix(in srgb, var(--main-accent) 20%, var(--main-light));
  --main-shadow: color-mix(in srgb, var(--main-text) 12%, transparent);
}

:where([data-etch-element="section"]) {
  inline-size: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
}

:where([data-etch-element="container"]) {
  inline-size: 100%;
  display: flex;
  flex-direction: column;
  max-inline-size: var(--content-width, 1366px);
  align-self: center; margin-inline: auto;
}

.main-heading {
  display: flex;
  flex-direction: column;
  gap: var(--space-xs);
  max-inline-size: calc(600 * 1rem / var(--etch-root-px, 10));
}

.main-heading--center {
  align-items: center;
  margin-inline: auto;
  text-align: center;
}

.main-heading__eyebrow {
  display: flex;
  align-items: center;
  gap: var(--space-xs);
  font-size: var(--text-s);
  font-weight: 600;
  letter-spacing: 0.08em;
  color: var(--main-primary);

  &::before {
    content: "";
    inline-size: calc(24 * 1rem / var(--etch-root-px, 10));
    block-size: 2px;
    background-color: var(--main-accent);
  }
}

.main-heading__intro {
  color: var(--main-text-muted);
}

.main-form {
  /* plain HTML form: set its action to your form endpoint (Formspree, a form plugin …) */
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: var(--space-s);
  inline-size: 100%;

  @media (width <= 600px) {
    grid-template-columns: 1fr;
  }
}

.main-form__field {
  display: flex;
  flex-direction: column;
  gap: calc(var(--space-xs) / 2);
}

.main-form__field--wide {
  grid-column: 1 / -1;
}

.main-form__label {
  font-size: var(--text-s);
  font-weight: 600;
  color: var(--main-text);
}

.main-form__input {
  inline-size: 100%;
  padding: calc(12 * 1rem / var(--etch-root-px, 10)) calc(14 * 1rem / var(--etch-root-px, 10));
  border: 1px solid var(--main-line);
  border-radius: var(--radius-s);
  background-color: var(--main-light);
  color: var(--main-text);
  font: inherit;
  transition: border-color 0.2s ease, box-shadow 0.2s ease;

  &::placeholder {
    color: var(--main-text-muted);
  }

  &:focus {
    outline: none;
    border-color: var(--main-primary);
    box-shadow: 0 0 0 3px var(--main-accent-soft);
  }

  &:is(textarea) {
    min-block-size: calc(120 * 1rem / var(--etch-root-px, 10));
    resize: vertical;
  }
}

.main-form__submit {
  grid-column: 1 / -1;
}

.main-form__note {
  grid-column: 1 / -1;
  margin: 0;
  font-size: var(--text-s);
  color: var(--main-text-muted);
}

.main-form-card {
  display: flex;
  flex-direction: column;
  gap: var(--space-m);
  padding: var(--space-l);
  border-radius: var(--radius-l);
  background-color: var(--main-light);
  color: var(--main-text);
  box-shadow: 0 calc(12 * 1rem / var(--etch-root-px, 10)) calc(28 * 1rem / var(--etch-root-px, 10)) var(--main-shadow);

  /* stays primary inside a dark section, whose headings inherit the light text colour */
  & .main-form-card__title {
    color: var(--main-primary);
  }

  @media (width <= 600px) {
    padding: var(--space-m);
  }
}

.main-form-card__title {
  margin: 0;
  font-size: var(--h4);
}

.main-cta-form-map__contacts {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(min(100%, calc(240 * 1rem / var(--etch-root-px, 10))), 1fr));
  gap: var(--space-m);
  padding-block-start: var(--space-l);
  border-block-start: 1px solid var(--main-line);
  margin: 0;
  padding: 0;
  list-style: none;
}

.main-cta-form-map__item {
  display: flex;
  align-items: center;
  gap: var(--space-s);
}

.main-cta-form-map__icon {
  flex: none;
  inline-size: calc(48 * 1rem / var(--etch-root-px, 10));
  block-size: calc(48 * 1rem / var(--etch-root-px, 10));
  padding: calc(12 * 1rem / var(--etch-root-px, 10));
  border-radius: 50%;
  background-color: var(--main-accent-soft);
  color: var(--main-primary);
}

.main-cta-form-map__body {
  display: flex;
  flex-direction: column;
}

.main-cta-form-map__label {
  font-size: var(--text-s);
  color: var(--main-text-muted);
}

.main-cta-form-map__link {
  font-weight: 700;
  color: inherit;
  text-decoration: none;

  &:hover {
    text-decoration: underline;
    text-decoration-color: var(--main-accent);
  }
}

.main-cta-form-map {
  background-color: var(--main-light);
}

.main-cta-form-map__container {
  gap: var(--container-gap);
}

.main-cta-form-map__grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(min(100%, calc(400 * 1rem / var(--etch-root-px, 10))), 1fr));
  gap: var(--container-gap);
  align-items: stretch;
}

.main-cta-form-map__map {
  display: block;
  inline-size: 100%;
  block-size: 100%;
  min-block-size: calc(360 * 1rem / var(--etch-root-px, 10));
  border: 0;
  border-radius: var(--radius-m);
  background-color: var(--main-light-alt);
}
</style>
</head>
