<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stats บนรูป — preview</title>
<link rel="stylesheet" href="assets/acss-sim.css">
<style>
:where(:root) {
  /* ===== MAIN TEMPLATE COLOURS — change colours here only =====
     Header, footer and every main-* section use these variables.
     By default they follow ACSS: changing Primary / Secondary in ACSS changes the templates too. */
  --main-primary: var(--primary, #1e3a5f);    /* brand: header, footer, FAQ, headings, links, tags */
  --main-accent: var(--secondary, #e8a33d);   /* highlight: underlines, hover, eyebrow line, active */
  --main-light: var(--white, #fff);           /* light backgrounds: sections, cards, article box */
  --main-text: var(--text-dark, #1a1a1a);     /* text on light backgrounds */
  --main-on-primary: var(--white, #fff);      /* text and icons on the primary colour */

  /* derived from the five colours above — no need to edit */
  --main-light-alt: color-mix(in srgb, var(--main-primary) 6%, var(--main-light));
  --main-text-muted: color-mix(in srgb, var(--main-text) 72%, transparent);
  --main-on-primary-muted: color-mix(in srgb, var(--main-on-primary) 78%, transparent);
  --main-line: color-mix(in srgb, var(--main-primary) 18%, transparent);
  --main-line-on-primary: color-mix(in srgb, var(--main-on-primary) 18%, transparent);
  --main-accent-soft: color-mix(in srgb, var(--main-accent) 20%, var(--main-light));
  --main-shadow: color-mix(in srgb, var(--main-text) 12%, transparent);
}

:where([data-etch-element="section"]) {
  inline-size: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
}

:where([data-etch-element="container"]) {
  inline-size: 100%;
  display: flex;
  flex-direction: column;
  max-inline-size: var(--content-width, 1366px);
  align-self: center; margin-inline: auto;
}

.main-heading {
  display: flex;
  flex-direction: column;
  gap: var(--space-xs);
  max-inline-size: calc(600 * 1rem / var(--etch-root-px, 10));
}

.main-heading--center {
  align-items: center;
  margin-inline: auto;
  text-align: center;
}

.main-heading__eyebrow {
  display: flex;
  align-items: center;
  gap: var(--space-xs);
  font-size: var(--text-s);
  font-weight: 600;
  letter-spacing: 0.08em;
  color: var(--main-primary);

  &::before {
    content: "";
    inline-size: calc(24 * 1rem / var(--etch-root-px, 10));
    block-size: 2px;
    background-color: var(--main-accent);
  }
}

.main-heading__intro {
  color: var(--main-text-muted);
}

.main-stats-image {
  position: relative;
  isolation: isolate;
  overflow: hidden;
  color: var(--main-on-primary);

  /* overlay over the photo */
  &::before {
    content: "";
    position: absolute;
    inset: 0;
    z-index: -1;
    background-color: color-mix(in srgb, var(--main-primary) 82%, transparent);
  }

  :is(h1, h2, h3, h4, h5, h6),
  .main-heading__eyebrow {
    color: inherit;
  }

  .main-heading__intro {
    color: var(--main-on-primary-muted);
  }
}

.main-stats-image__container {
  gap: var(--container-gap);
}

.main-stats-image__bg {
  position: absolute;
  inset: 0;
  z-index: -2;
  margin: 0;
}

.main-stats-image__img {
  display: block;
  inline-size: 100%;
  block-size: 100%;
  object-fit: cover;
  background-color: var(--main-primary);
}

.main-stats-image__grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(min(100%, calc(180 * 1rem / var(--etch-root-px, 10))), 1fr));
  gap: var(--grid-gap);
  margin: 0;
  padding: 0;
  list-style: none;
  text-align: center;
}

.main-stats-image__item {
  display: flex;
  flex-direction: column;
  gap: var(--space-xs);
  padding: var(--space-m) var(--space-s);
  border: 1px solid var(--main-line-on-primary);
  border-radius: var(--radius-m);
}

.main-stats-image__number {
  margin: 0;
  font-size: var(--h1);
  font-weight: 800;
  line-height: 1;
  color: var(--main-accent);
}

.main-stats-image__label {
  margin: 0;
  color: var(--main-on-primary-muted);
}
</style>
</head>
<body data-template="stats-image">
<section data-etch-element="section" class="main-stats-image"><figure class="main-stats-image__bg"><img class="main-stats-image__img" loading="lazy" data-pv-img="i:g.0.0" src="data:image/svg+xml;utf8,&lt;svg xmlns=&#x27;http://www.w3.org/2000/svg&#x27; viewBox=&#x27;0 0 400 300&#x27; preserveAspectRatio=&#x27;xMidYMid slice&#x27;&gt;&lt;rect width=&#x27;400&#x27; height=&#x27;300&#x27; fill=&#x27;%23b8bfc9&#x27; fill-opacity=&#x27;.35&#x27;/&gt; &lt;circle cx=&#x27;290&#x27; cy=&#x27;95&#x27; r=&#x27;34&#x27; fill=&#x27;%23ffffff&#x27; fill-opacity=&#x27;.6&#x27;/&gt; &lt;path d=&#x27;M0 300 L120 150 L200 240 L260 180 L400 300 Z&#x27; fill=&#x27;%23778293&#x27; fill-opacity=&#x27;.45&#x27;/&gt;&lt;/svg&gt;" alt=""></figure><div data-etch-element="container" class="main-stats-image__container"><div class="main-heading main-heading--center"><p class="main-heading__eyebrow" data-pv-edit="t:g.1.0.0.0">Our results</p><h2 data-pv-edit="t:g.1.0.1.0">Trusted by thousands of customers</h2></div><ul class="main-stats-image__grid"><li class="main-stats-image__item"><p class="main-stats-image__number" data-pv-edit="t:g.1.1.0.0.0">15+</p><p class="main-stats-image__label" data-pv-edit="t:g.1.1.0.1.0">Years of experience</p></li><li class="main-stats-image__item"><p class="main-stats-image__number" data-pv-edit="t:g.1.1.1.0.0">2,000+</p><p class="main-stats-image__label" data-pv-edit="t:g.1.1.1.1.0">Happy customers</p></li><li class="main-stats-image__item"><p class="main-stats-image__number" data-pv-edit="t:g.1.1.2.0.0">98%</p><p class="main-stats-image__label" data-pv-edit="t:g.1.1.2.1.0">Would recommend us</p></li><li class="main-stats-image__item"><p class="main-stats-image__number" data-pv-edit="t:g.1.1.3.0.0">24/7</p><p class="main-stats-image__label" data-pv-edit="t:g.1.1.3.1.0">Online support</p></li></ul></div></section>
<script src="assets/frame.js"></script>

</body>
</html>
